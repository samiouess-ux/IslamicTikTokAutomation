name: Build Quran-wide official verse audio inventory

on:
  push:
    branches: [feature/telegram-review-notifications]
    paths:
      - "src/build_official_audio_inventory.py"
      - "src/prepare_official_quran_passage.py"
      - "src/prepare_quran_review_batch_audio.py"
      - "src/build_quran_review_batch.py"
      - "src/build_quran_draft_manifests.py"
      - "tests/test_build_quran_draft_manifests.py"
      - "src/build_quran_translation_catalog.py"
      - "src/build_quran_uthmani_catalog.py"
      - "src/build_quran_video_catalog.py"
      - "tests/test_build_quran_uthmani_catalog.py"
      - "tests/test_build_quran_video_catalog.py"
      - "tests/test_prepare_quran_review_batch_audio.py"
      - ".github/workflows/build-quran-audio-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audio probe and archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check remotezip
      - name: Inspect official archive and validate complete verse mapping
        run: |
          python src/build_official_audio_inventory.py output/official_verse_audio_inventory.json
      - name: Build and validate full Saheeh translation corpus
        run: |
          python src/build_quran_translation_catalog.py --output output/saheeh_international_translation.json
      - name: Verify generated translation artifact input
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("output/saheeh_international_translation.json")
          if not path.is_file() or path.stat().st_size == 0:
              raise SystemExit("Validated Saheeh translation corpus file is missing or empty.")
          catalog = json.loads(path.read_text(encoding="utf-8"))
          verses = catalog.get("verses")
          if catalog.get("edition") != "en.sahih":
              raise SystemExit("Unexpected translation edition.")
          if catalog.get("translated_verse_count") != 6236:
              raise SystemExit("Translation metadata does not report 6,236 verses.")
          if not isinstance(verses, dict) or len(verses) != 6236:
              raise SystemExit("Translation JSON does not contain exactly 6,236 verse entries.")
          if catalog.get("status") != "complete_source_corpus_requires_rights_confirmation_and_verse_level_review":
              raise SystemExit("Translation review/rights status is missing or unexpected.")
          print(f"Verified artifact input: {len(verses)} Saheeh International verses.")
          PY
      - name: Build complete Uthmani Arabic candidate corpus (not approved for rendering)
        run: |
          python src/build_quran_uthmani_catalog.py --output output/quran_uthmani_candidate.json
      - name: Verify Uthmani corpus coverage and mandatory review gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("output/quran_uthmani_candidate.json")
          if not path.is_file() or path.stat().st_size == 0:
              raise SystemExit("Uthmani candidate corpus is missing or empty.")
          catalog = json.loads(path.read_text(encoding="utf-8"))
          verses = catalog.get("verses")
          if catalog.get("edition") != "quran-uthmani" or catalog.get("script") != "uthmani":
              raise SystemExit("Unexpected Arabic text edition/script.")
          if catalog.get("fetched_verse_count") != 6236 or not isinstance(verses, dict) or len(verses) != 6236:
              raise SystemExit("Uthmani candidate corpus does not contain exactly 6,236 verse entries.")
          if catalog.get("review_status") != "source_fetched_not_human_reviewed" or catalog.get("rendering_allowed") is not False:
              raise SystemExit("Uthmani human-review/rendering safety gate is missing.")
          print("Verified 6,236 Uthmani verse entries. Human review required; rendering remains disabled.")
          PY
      - name: Join Arabic, translation and audio by exact surah:ayah keys (review-only)
        run: |
          python src/build_quran_video_catalog.py \
            --arabic output/quran_uthmani_candidate.json \
            --translation output/saheeh_international_translation.json \
            --audio output/official_verse_audio_inventory.json \
            --output output/quran_joined_candidate.json
      - name: Verify joined catalog remains blocked from rendering
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(Path("output/quran_joined_candidate.json").read_text(encoding="utf-8"))
          if catalog.get("joined_verse_count") != 6236 or len(catalog.get("verses", {})) != 6236:
              raise SystemExit("Joined Quran catalog must contain exactly 6,236 verses.")
          if catalog.get("join_key") != "surah:ayah" or catalog.get("rendering_allowed") is not False:
              raise SystemExit("Joined catalog key or fail-closed rendering gate is invalid.")
          if catalog.get("status") != "complete_join_candidate_requires_human_review_and_recording_approval":
              raise SystemExit("Joined catalog review status is missing.")
          print("Verified 6,236 exact-key joins. Candidate catalog remains blocked from rendering.")
          PY
      - name: Run Quran catalog regression tests
        run: |
          python -m unittest discover -s tests -p 'test_build_quran_*catalog.py' -v
          python -m unittest discover -s tests -p 'test_prepare_quran_review_batch_audio.py' -v
          python -m unittest discover -s tests -p 'test_build_quran_draft_manifests.py' -v
      - name: Build a diverse five-surah Quran review candidate batch
        run: |
          python src/build_quran_review_batch.py \
            --catalog output/quran_joined_candidate.json \
            --count 5 \
            --verses-per-passage 3 \
            --seed github-actions-quran-batch \
            --output output/quran_review_batch.json
          python - <<'PY'
          import json
          from pathlib import Path
          batch = json.loads(Path("output/quran_review_batch.json").read_text(encoding="utf-8"))
          assert batch["candidate_count"] == 5
          assert batch["distinct_surah_count"] == 5
          assert batch["rendering_allowed"] is False
          assert batch["telegram_delivery"] is False
          assert batch["auto_publish"] is False
          assert all(item["approval"]["ready_to_render"] is False for item in batch["passages"])
          print("Prepared five distinct-surah passages for human review only.")
          PY
      - name: Prepare audio for the five distinct-surah review candidates
        run: |
          python src/prepare_quran_review_batch_audio.py \
            --batch output/quran_review_batch.json \
            --inventory output/official_verse_audio_inventory.json \
            --output-dir output/quran_batch_audio \
            --report output/quran_batch_audio_report.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("output/quran_batch_audio_report.json").read_text(encoding="utf-8"))
          if report["audio_prepared_count"] < 2:
              raise SystemExit("At least two distinct-surah audio candidates must be prepared.")
          if report["distinct_surah_count"] != report["audio_prepared_count"]:
              raise SystemExit("Audio candidates must come from distinct surahs.")
          if report["rendering_allowed"] or report["telegram_delivery"] or report["auto_publish"]:
              raise SystemExit("Audio preparation must remain review-only.")
          print(f"Prepared {report['audio_prepared_count']} distinct-surah audio candidates.")
          PY
      - name: Generate draft manifests automatically for every prepared distinct surah
        run: |
          python src/build_quran_draft_manifests.py \
            --batch output/quran_review_batch.json \
            --audio-report output/quran_batch_audio_report.json \
            --output-dir output/quran_draft_manifests \
            --report output/quran_draft_manifest_report.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("output/quran_draft_manifest_report.json").read_text(encoding="utf-8"))
          if report["manifest_count"] < 2 or report["manifest_count"] != report["distinct_surah_count"]:
              raise SystemExit("Expected at least two distinct-surah draft manifests.")
          if report["rendering_allowed"] or report["telegram_delivery"] or report["auto_publish"]:
              raise SystemExit("Draft manifests must remain blocked from rendering and delivery.")
          for item in report["items"]:
              manifest = json.loads(Path(item["manifest"]).read_text(encoding="utf-8"))
              if manifest["audio"]["approved"] or manifest["audio"]["rights_verified"]:
                  raise SystemExit("Draft manifest unexpectedly grants audio approval.")
              if manifest["visual"]["background_candidate"]:
                  raise SystemExit("Draft manifest unexpectedly contains an approved background.")
          print(f"Generated {report['manifest_count']} distinct-surah draft manifests; production gates remain closed.")
          PY
      - name: Upload Quran-wide inventory, translation, and candidate audio probe
        uses: actions/upload-artifact@v4
        with:
          name: official-quran-audio-inventory-and-probe
          path: |
            output/official_verse_audio_inventory.json
            output/saheeh_international_translation.json
            output/quran_uthmani_candidate.json
            output/quran_joined_candidate.json
            output/quran_review_batch.json
            output/quran_batch_audio_report.json
            output/quran_batch_audio/**/*.mp3
            output/quran_draft_manifests/*.json
            output/quran_draft_manifest_report.json
          if-no-files-found: error
          retention-days: 30
