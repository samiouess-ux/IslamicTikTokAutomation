name: Build Quran-wide official verse audio inventory

concurrency:
  group: quran-review-inventory-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [feature/telegram-review-notifications]
    paths:
      - "src/build_official_audio_inventory.py"
      - "data/background_candidates.json"
      - "tests/test_background_candidates.py"
      - "src/prepare_background_review_previews.py"
      - "tests/test_prepare_background_review_previews.py"
      - "src/prepare_official_quran_passage.py"
      - "src/prepare_quran_review_batch_audio.py"
      - "src/build_quran_review_batch.py"
      - "src/build_quran_draft_manifests.py"
      - "src/quran_social_caption.py"
      - "tests/test_quran_social_caption.py"
      - "src/render_quran_review_previews.py"
      - "src/send_telegram.py"
      - "src/record_quran_delivery.py"
      - "src/quran_delivery_attempt.py"
      - "tests/test_record_quran_delivery.py"
      - "tests/test_quran_delivery_attempt.py"
      - "tests/test_telegram_workflow_safety.py"
      - "tests/test_send_telegram.py"
      - "tests/test_render_quran_review_previews.py"
      - "tests/test_build_quran_draft_manifests.py"
      - "src/build_quran_translation_catalog.py"
      - "src/build_quran_uthmani_catalog.py"
      - "src/build_quran_video_catalog.py"
      - "tests/test_build_quran_uthmani_catalog.py"
      - "tests/test_build_quran_video_catalog.py"
      - "src/tunisian_day_status.py"
      - "tests/test_build_quran_tunisian_day_status.py"
      - "tests/test_prepare_quran_review_batch_audio.py"
      - ".github/workflows/build-quran-audio-inventory.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Block automatic sends when a previous Telegram outcome is unresolved
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: python src/quran_delivery_attempt.py guard --pending data/quran_delivery_pending.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audio probe and archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-dejavu-core fonts-hosny-amiri
          python -m pip install --disable-pip-version-check remotezip pillow
      - name: Test official archive retry and filename mapping safeguards
        run: python -m unittest discover -s tests -p 'test_build_official_audio_inventory.py' -v
      - name: Validate staged background source URLs and disabled approval gates
        run: |
          python -m unittest discover -s tests -p 'test_background_candidates.py' -v
          python -m unittest discover -s tests -p 'test_prepare_background_review_previews.py' -v
      - name: Inspect official archive and validate complete verse mapping
        run: |
          python src/build_official_audio_inventory.py output/official_verse_audio_inventory.json
      - name: Build and validate full Saheeh translation corpus
        run: |
          python src/build_quran_translation_catalog.py --output output/saheeh_international_translation.json
      - name: Verify generated translation artifact input
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("output/saheeh_international_translation.json")
          if not path.is_file() or path.stat().st_size == 0:
              raise SystemExit("Validated Saheeh translation corpus file is missing or empty.")
          catalog = json.loads(path.read_text(encoding="utf-8"))
          verses = catalog.get("verses")
          if catalog.get("edition") != "en.sahih":
              raise SystemExit("Unexpected translation edition.")
          if catalog.get("translated_verse_count") != 6236:
              raise SystemExit("Translation metadata does not report 6,236 verses.")
          if not isinstance(verses, dict) or len(verses) != 6236:
              raise SystemExit("Translation JSON does not contain exactly 6,236 verse entries.")
          if catalog.get("status") != "complete_source_corpus_requires_rights_confirmation_and_verse_level_review":
              raise SystemExit("Translation review/rights status is missing or unexpected.")
          print(f"Verified artifact input: {len(verses)} Saheeh International verses.")
          PY
      - name: Build complete Uthmani Arabic candidate corpus (not approved for rendering)
        run: |
          python src/build_quran_uthmani_catalog.py --output output/quran_uthmani_candidate.json
      - name: Verify Uthmani corpus coverage and mandatory review gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("output/quran_uthmani_candidate.json")
          if not path.is_file() or path.stat().st_size == 0:
              raise SystemExit("Uthmani candidate corpus is missing or empty.")
          catalog = json.loads(path.read_text(encoding="utf-8"))
          verses = catalog.get("verses")
          if catalog.get("edition") != "quran-uthmani" or catalog.get("script") != "uthmani":
              raise SystemExit("Unexpected Arabic text edition/script.")
          if catalog.get("fetched_verse_count") != 6236 or not isinstance(verses, dict) or len(verses) != 6236:
              raise SystemExit("Uthmani candidate corpus does not contain exactly 6,236 verse entries.")
          if catalog.get("review_status") != "source_fetched_not_human_reviewed" or catalog.get("rendering_allowed") is not False:
              raise SystemExit("Uthmani human-review/rendering safety gate is missing.")
          print("Verified 6,236 Uthmani verse entries. Human review required; rendering remains disabled.")
          PY
      - name: Join Arabic, translation and audio by exact surah:ayah keys (review-only)
        run: |
          python src/build_quran_video_catalog.py \
            --arabic output/quran_uthmani_candidate.json \
            --translation output/saheeh_international_translation.json \
            --audio output/official_verse_audio_inventory.json \
            --output output/quran_joined_candidate.json
      - name: Verify joined catalog remains blocked from rendering
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(Path("output/quran_joined_candidate.json").read_text(encoding="utf-8"))
          if catalog.get("joined_verse_count") != 6236 or len(catalog.get("verses", {})) != 6236:
              raise SystemExit("Joined Quran catalog must contain exactly 6,236 verses.")
          if catalog.get("join_key") != "surah:ayah" or catalog.get("rendering_allowed") is not False:
              raise SystemExit("Joined catalog key or fail-closed rendering gate is invalid.")
          if catalog.get("status") != "complete_join_candidate_requires_human_review_and_recording_approval":
              raise SystemExit("Joined catalog review status is missing.")
          print("Verified 6,236 exact-key joins. Candidate catalog remains blocked from rendering.")
          PY
      - name: Run Quran catalog regression tests
        run: |
          python -m unittest discover -s tests -p 'test_quran_social_caption.py' -v
          python -m unittest discover -s tests -p 'test_build_quran_*catalog.py' -v
          python -m unittest discover -s tests -p 'test_build_quran_review_batch.py' -v
          python -m unittest discover -s tests -p 'test_build_quran_tunisian_day_status.py' -v
          python -m unittest discover -s tests -p 'test_prepare_quran_review_batch_audio.py' -v
          python -m unittest discover -s tests -p 'test_build_quran_draft_manifests.py' -v
          python -m unittest discover -s tests -p 'test_render_quran_review_previews.py' -v
          python -m unittest discover -s tests -p 'test_send_telegram.py' -v
          python -m unittest discover -s tests -p 'test_record_quran_delivery.py' -v
          python -m unittest discover -s tests -p 'test_quran_delivery_attempt.py' -v
          python -m unittest discover -s tests -p 'test_telegram_workflow_safety.py' -v
      - name: Detect Friday using Tunisia local time
        id: tunisian_day
        run: python src/tunisian_day_status.py >> "$GITHUB_OUTPUT"
      - name: Build weekday-aware Quran review candidate
        env:
          IS_FRIDAY: ${{ steps.tunisian_day.outputs.is_friday }}
        run: |
          if [ "$IS_FRIDAY" = "true" ]; then
            echo "Friday mode: Surah Al-Kahf only; continue from the first unused ayah."
            python src/build_quran_review_batch.py \
              --catalog output/quran_joined_candidate.json \
              --count 1 \
              --only-surah 18 \
              --sequential-unused \
              --history data/quran_delivery_history.json \
              --seed "quran-friday-$(date -u +%F-%H)" \
              --output output/quran_review_batch.json
          else
            echo "Regular Quran mode: eight diverse surahs; exclude Al-Kahf outside Friday."
            python src/build_quran_review_batch.py \
              --catalog output/quran_joined_candidate.json \
              --count 8 \
              --exclude-surah 18 \
              --exclude-surah 94 \
              --history data/quran_delivery_history.json \
              --seed "quran-daily-$(date -u +%F-%H)" \
              --output output/quran_review_batch.json
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          batch = json.loads(Path("output/quran_review_batch.json").read_text(encoding="utf-8"))
          if os.environ.get("IS_FRIDAY") == "true":
              if batch["candidate_count"] != 1 or batch["distinct_surah_count"] != 1:
                  raise SystemExit("Friday must prepare exactly one Surah Al-Kahf candidate per scheduled slot.")
              if batch["passages"][0]["surah_number"] != 18:
                  raise SystemExit("Friday candidate must be Surah Al-Kahf.")
              history_path = Path("data/quran_delivery_history.json")
              history = json.loads(history_path.read_text(encoding="utf-8")) if history_path.exists() else {}
              used = set(history.get("ayah_references", []))
              first_unused = next((n for n in range(1, 111) if f"18:{n}" not in used), None)
              if first_unused is None or batch["passages"][0]["verse_numbers"][0] != first_unused:
                  raise SystemExit("Friday Al-Kahf must continue from the first unused ayah.")
          else:
              if not 1 <= batch["candidate_count"] <= 8 or batch["distinct_surah_count"] != batch["candidate_count"]:
                  raise SystemExit("Regular days must prepare up to eight distinct, not-yet-used surah candidates.")
              if 18 in [item["surah_number"] for item in batch["passages"]]:
                  raise SystemExit("Surah Al-Kahf is reserved for Friday mode.")
          if batch["rendering_allowed"] is not False or batch["telegram_delivery"] is not False or batch["auto_publish"] is not False:
              raise SystemExit("Candidate batch safety gates must remain disabled.")
          if not all(item["approval"]["ready_to_render"] is False for item in batch["passages"]):
              raise SystemExit("Candidate batch unexpectedly includes a render-approved passage.")
          print(f"Prepared {batch['candidate_count']} candidate(s); Friday mode={os.environ.get('IS_FRIDAY')}.")
          PY
      - name: Prepare one distinct-surah video for this scheduled slot
        run: |
          python src/prepare_quran_review_batch_audio.py \
            --batch output/quran_review_batch.json \
            --inventory output/official_verse_audio_inventory.json \
            --output-dir output/quran_batch_audio \
            --report output/quran_batch_audio_report.json \
            --target-count 1
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("output/quran_batch_audio_report.json").read_text(encoding="utf-8"))
          if report["audio_prepared_count"] != 1:
              raise SystemExit("Exactly one distinct-surah audio candidate must be prepared for this scheduled slot.")
          if report["distinct_surah_count"] != report["audio_prepared_count"]:
              raise SystemExit("Audio candidates must come from distinct surahs.")
          if report["rendering_allowed"] or report["telegram_delivery"] or report["auto_publish"]:
              raise SystemExit("Audio preparation must remain review-only.")
          print(f"Prepared {report['audio_prepared_count']} distinct-surah audio candidates.")
          PY
      - name: Generate draft manifests automatically for every prepared distinct surah
        run: |
          python src/build_quran_draft_manifests.py \
            --batch output/quran_review_batch.json \
            --audio-report output/quran_batch_audio_report.json \
            --output-dir output/quran_draft_manifests \
            --report output/quran_draft_manifest_report.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("output/quran_draft_manifest_report.json").read_text(encoding="utf-8"))
          if report["distinct_surah_count"] != 1 or report["manifest_count"] != report["preview_part_count"]:
              raise SystemExit("Expected one distinct surah with one draft manifest for each audio part.")
          if report["rendering_allowed"] or report["telegram_delivery"] or report["auto_publish"]:
              raise SystemExit("Draft manifests must remain blocked from rendering and delivery.")
          for item in report["items"]:
              manifest = json.loads(Path(item["manifest"]).read_text(encoding="utf-8"))
              if manifest["audio"]["approved"] or manifest["audio"]["rights_verified"]:
                  raise SystemExit("Draft manifest unexpectedly grants audio approval.")
              if manifest["visual"]["background_candidate"]:
                  raise SystemExit("Draft manifest unexpectedly contains an approved background.")
          print(f"Generated {report['manifest_count']} distinct-surah draft manifests; production gates remain closed.")
          PY
      - name: Render distinct-surah 9:16 review-only video previews
        run: |
          python src/render_quran_review_previews.py \
            --batch output/quran_review_batch.json \
            --audio-report output/quran_batch_audio_report.json \
            --output-dir output/quran_review_previews \
            --minimum-previews 1
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("output/quran_review_previews/preview_report.json").read_text(encoding="utf-8"))
          audio_report = json.loads(Path("output/quran_batch_audio_report.json").read_text(encoding="utf-8"))
          expected_parts = audio_report["preview_part_count"]
          if report["preview_count"] != expected_parts or report["production_approved"]:
              raise SystemExit("Expected one review-only preview for each audio part, with production approval disabled.")
          if report["telegram_delivery"] or report["auto_publish"]:
              raise SystemExit("Telegram delivery and auto-publishing must remain disabled.")
          for item in report["items"]:
              if (item["width"], item["height"]) != (1080, 1920):
                  raise SystemExit("Preview is not vertical 9:16.")
              if item["audio_codec"] != "mp3" or item["video_codec"] != "h264":
                  raise SystemExit("Preview must preserve original MP3 audio stream.")
          print(f"Rendered {report['preview_count']} distinct-surah 9:16 review-only previews.")
          PY
      - name: Download and prepare review-only background crop previews with actual Quran overlay
        run: |
          overlay_frame="$(find output/quran_review_previews -type f -name 'ayah_*.png' | sort | head -n 1)"
          if [ -z "$overlay_frame" ]; then
            echo "No actual rendered Quran overlay frame was produced."
            exit 1
          fi
          python src/prepare_background_review_previews.py \
            --catalog data/background_candidates.json \
            --output-dir output/background_review \
            --overlay-frame "$overlay_frame"
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("output/background_review/background_review_report.json").read_text(encoding="utf-8"))
          if report["candidate_count"] != 4 or report["production_enabled"] is not False or report["user_approval_required"] is not True:
              raise SystemExit("Background review package must contain four disabled candidates.")
          if not all(item["download_probe_verified"] and item["user_approved"] is True for item in report["items"]):
              raise SystemExit("A candidate download/probe check failed or the recorded user approval is missing.")
          if report.get("overlay_legibility_review_required") is not True or not Path(report.get("quran_overlay_contact_sheet", "")).is_file():
              raise SystemExit("Actual Quran overlay contact sheet is missing.")
          print("Prepared four verified source downloads, 9:16 crops, and actual Quran-overlay legibility previews; none is production-approved.")
          PY
      - name: Upload Quran-wide inventory, translation, and candidate audio probe
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: official-quran-audio-inventory-and-probe
          path: |
            output/official_verse_audio_inventory.json
            output/saheeh_international_translation.json
            output/quran_uthmani_candidate.json
            output/quran_joined_candidate.json
            output/quran_review_batch.json
            output/quran_batch_audio_report.json
            output/quran_batch_audio/**/*.mp3
            output/quran_draft_manifests/*.json
            output/quran_draft_manifest_report.json
            output/quran_review_previews/*.mp4
            output/quran_review_previews/preview_report.json
            output/background_review/*.jpg
            output/background_review/background_review_report.json
          if-no-files-found: error
          retention-days: 3

      - name: Reserve Telegram delivery attempt before sending
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          python src/quran_delivery_attempt.py reserve \
            --pending data/quran_delivery_pending.json \
            --history data/quran_delivery_history.json \
            --batch output/quran_review_batch.json \
            --audio-report output/quran_batch_audio_report.json \
            --preview-report output/quran_review_previews/preview_report.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quran_delivery_pending.json
          git commit -m "Reserve Quran Telegram delivery attempt"
          git fetch origin feature/telegram-review-notifications
          git rebase origin/feature/telegram-review-notifications
          git push origin HEAD:refs/heads/feature/telegram-review-notifications

      - name: Send one review-only video to Telegram for manual approval
        id: telegram_send
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          sys.path.insert(0, "src")
          from quran_social_caption import build_social_caption

          report = json.loads(Path("output/quran_review_previews/preview_report.json").read_text(encoding="utf-8"))
          batch = json.loads(Path("output/quran_review_batch.json").read_text(encoding="utf-8"))
          if report.get("preview_count") != 1 or report.get("auto_publish") is not False:
              raise SystemExit("Telegram delivery requires exactly one review-only video and disabled auto-publishing.")
          if len({item["surah_number"] for item in report["items"]}) != 1 or len(report["items"]) != 1:
              raise SystemExit("Each scheduled Telegram slot must contain exactly one distinct surah.")
          batch_ids = {item["candidate_id"] for item in batch.get("passages", [])}
          for index, item in enumerate(report["items"], start=1):
              if item.get("source_candidate_id") not in batch_ids:
                  raise SystemExit("Preview source candidate is not present in the source batch.")
              if item.get("duration_seconds", 999) > 40:
                  raise SystemExit("Refusing to send a preview longer than 40 seconds.")
              manifest_path = Path("output/quran_draft_manifests") / f"{item['candidate_id']}.json"
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              caption_path = Path("output/telegram_captions") / f"{item['candidate_id']}.json"
              caption_path.parent.mkdir(parents=True, exist_ok=True)
              caption = build_social_caption(manifest, item["candidate_id"])
              caption_path.write_text(json.dumps(caption, ensure_ascii=False, indent=2), encoding="utf-8")
              subprocess.run([
                  sys.executable, "src/send_telegram.py",
                  "--video", item["file"],
                  "--caption", str(caption_path),
              ], check=True)
              print(f"Telegram confirmed scheduled video {index}/1: {item['candidate_id']}. TikTok publishing remains manual.")
          PY

      - name: Record Telegram-confirmed Quran delivery history
        if: steps.telegram_send.outcome == 'success' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          report = json.loads(Path("output/quran_review_previews/preview_report.json").read_text(encoding="utf-8"))
          if report.get("preview_count") != 1 or len(report.get("items", [])) != 1:
              raise SystemExit("Expected exactly one Telegram-confirmed review candidate.")
          candidate_id = report["items"][0]["candidate_id"]
          subprocess.run([
              sys.executable, "src/quran_delivery_attempt.py", "finalize",
              "--pending", "data/quran_delivery_pending.json",
              "--history", "data/quran_delivery_history.json",
              "--batch", "output/quran_review_batch.json",
              "--audio-report", "output/quran_batch_audio_report.json",
              "--candidate-id", candidate_id,
          ], check=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/quran_delivery_history.json data/quran_delivery_pending.json
          git diff --cached --quiet || git commit -m "Record Telegram-confirmed Quran review delivery and clear reservation"

      - name: Sync confirmed Quran delivery history to active branch
        if: steps.telegram_send.outcome == 'success' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        run: |
          git fetch origin feature/telegram-review-notifications
          git rebase origin/feature/telegram-review-notifications
          git push origin HEAD:refs/heads/feature/telegram-review-notifications

      - name: Notify Telegram if video preparation or delivery fails
        if: failure() && steps.telegram_send.outcome != 'success' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        continue-on-error: true
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ.get("TG_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          if not token or not chat_id:
              print("Cannot send failure notice: Telegram credentials are unavailable.")
              raise SystemExit(0)
          message = "⚠️ تعذّر تجهيز أو إرسال فيديو القرآن اليوم. افتح سجل التشغيل لمعرفة السبب."
          report_path = "output/quran_batch_audio_report.json"
          try:
              with open(report_path, encoding="utf-8") as source:
                  report = json.load(source)
              blocked = [
                  item for item in report.get("items", [])
                  if item.get("status") == "deferred_single_ayah_exceeds_40_seconds"
              ]
              if blocked:
                  item = blocked[0]
                  verses = item.get("requested_verses", [])
                  blocked_ayah = item.get("blocked_ayah")
                  if blocked_ayah is None:
                      blocked_ayah = verses[0] if verses else "غير محددة"
                  duration = item.get("blocked_ayah_duration_seconds")
                  duration_text = f" ({duration} ثانية)" if isinstance(duration, (int, float)) else ""
                  message = (
                      f"⚠️ توقّف تحضير سورة رقم {item.get('surah_number', '؟')} عند الآية {blocked_ayah}{duration_text}: "
                      "مدّة الآية الكاملة تتجاوز حدّ 40 ثانية. لم نقصّ التلاوة ولم نتجاوز الآية؛ "
                      "الآية تبقى مؤجّلة كاملة إلى أن يمكن تحضيرها دون تجاوز الحدّ."
                  )
          except (OSError, ValueError, TypeError):
              pass
          payload = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": message
          }).encode()
          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=payload,
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              result = json.loads(response.read().decode("utf-8"))
          if not result.get("ok"):
              raise SystemExit("Telegram did not accept the failure notification.")
          print("Telegram failure notification accepted.")
          PY
