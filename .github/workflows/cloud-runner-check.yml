name: Cloud runner check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloud-runner-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Check cloud environment
        run: |
          echo "GitHub-hosted cloud runner is working."
          python --version
          ffmpeg -version | head -n 1 || true
          echo "No audio files are downloaded or processed in this test."
