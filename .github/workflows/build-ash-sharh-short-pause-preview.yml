name: Build shortened-pause Ash-Sharh audio preview

on:
  push:
    branches: [feature/ash-sharh-1-8-review]
    paths:
      - ".github/workflows/build-ash-sharh-short-pause-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    if: github.ref != 'refs/heads/feature/quran-video-pro'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install audio tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Extract official verse recordings
        run: |
          python -m pip install --disable-pip-version-check remotezip
          mkdir -p output/original output/processed
          python - <<'PY'
          from remotezip import RemoteZip
          from pathlib import Path
          import hashlib, json
          url = "https://download.qurancomplex.gov.sa/new-sounds/muaiqly-08/hafs/ayat-12-1-2020.zip"
          prefix = "ayat-12-1-2020/094 Ash-Sharh ƒΘ¼⌐Ñ/"
          inventory = {}
          with RemoteZip(url) as archive:
              names = archive.namelist()
              for verse in range(1, 9):
                  suffix = f"10-094{verse:03d}-A08.mp3"
                  found = [name for name in names if name.startswith(prefix) and name.endswith(suffix)]
                  if len(found) != 1:
                      raise RuntimeError(f"Expected one source file for verse {verse}; got {found}")
                  path = Path("output/original") / f"verse_{verse:02d}.mp3"
                  with archive.open(found[0]) as src, path.open("wb") as dst:
                      while chunk := src.read(1024 * 1024):
                          dst.write(chunk)
                  inventory[str(verse)] = {"archive_entry": found[0], "sha256": hashlib.sha256(path.read_bytes()).hexdigest()}
          Path("output/source_inventory.json").write_text(json.dumps({
              "source": url, "collection": "King Fahd Complex official Hafs archive",
              "verses": inventory, "originals_preserved": True
          }, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
      - name: Shorten only trailing silence and insert consistent inter-verse pauses
        run: |
          set -euo pipefail
          for n in 01 02 03 04 05 06 07 08; do
            ffmpeg -hide_banner -y -i "output/original/verse_${n}.mp3" \
              -af "silenceremove=stop_periods=1:stop_duration=0.45:stop_threshold=-55dB:stop_mode=all" \
              -c:a libmp3lame -q:a 2 "output/processed/verse_${n}.mp3"
          done
          : > output/processed/concat.txt
          for n in 01 02 03 04 05 06 07 08; do
            printf "file 'verse_%s.mp3'\\n" "$n" >> output/processed/concat.txt
            if [ "$n" != "08" ]; then
              printf "file 'pause_0_70.mp3'\\n" >> output/processed/concat.txt
            fi
          done
          ffmpeg -hide_banner -y -f lavfi -i anullsrc=r=44100:cl=stereo -t 0.70 -c:a libmp3lame -q:a 2 output/processed/pause_0_70.mp3
          cd output/processed
          ffmpeg -hide_banner -y -f concat -safe 0 -i concat.txt -c:a libmp3lame -q:a 2 ../ash_sharh_94_1_8_short_pause_preview.mp3
          ffprobe -v error -show_entries format=duration,size -of json ../ash_sharh_94_1_8_short_pause_preview.mp3 > ../short_preview_probe.json
          sha256sum ../ash_sharh_94_1_8_short_pause_preview.mp3 > ../short_preview_sha256.txt
      - name: Record review-only status and upload package
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          probe = json.loads(Path("output/short_preview_probe.json").read_text())
          Path("output/short_preview_review.json").write_text(json.dumps({
              "status": "awaiting_user_listening_approval",
              "preview_file": "ash_sharh_94_1_8_short_pause_preview.mp3",
              "duration_seconds": float(probe["format"]["duration"]),
              "inter_verse_silence_seconds": 0.70,
              "processing": "trim trailing silence after at least 0.45 seconds below -55 dB; re-encode audio without time-stretching; insert 0.70 second silence between verses",
              "original_verse_files_preserved": True,
              "production_approved": False,
              "publishing": "disabled"
          }, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ash-sharh-94-1-8-short-pause-preview
          path: |
            output/original/
            output/ash_sharh_94_1_8_short_pause_preview.mp3
            output/source_inventory.json
            output/short_preview_probe.json
            output/short_preview_sha256.txt
            output/short_preview_review.json
          if-no-files-found: error
          retention-days: 7
