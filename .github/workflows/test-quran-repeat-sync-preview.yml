name: Isolated Quran repeat-aware sync preview (18:14)

on:
  push:
    branches:
      - test/quran-repeat-sync-preview

permissions:
  contents: read

jobs:
  render-review-only-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out isolated test branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and Arabic font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fontconfig fonts-hosny-amiri

      - name: Install preview dependencies and aligner
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow "git+https://github.com/voltarostudio/quran-word-align.git"

      - name: Download Maher Al-Muaiqly audio
        run: |
          mkdir -p test-audio
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://cdn.mp3quran.net/audio/maher-muaiqly/r1/018.mp3" \
            --output test-audio/018.mp3

      - name: Align Surah Al-Kahf
        run: |
          quran-word-align file test-audio/018.mp3 18 --riwayah hafs --out aligned --format json

      - name: Render isolated phrase-repeat synchronization preview
        run: python scripts/render_repeat_sync_preview.py

      - name: Publish review-only MP4 and timing report
        uses: actions/upload-artifact@v4
        with:
          name: quran-18-14-repeat-sync-preview
          path: |
            quran-18-14-repeat-sync-preview.mp4
            quran-18-14-repeat-sync-report.json
          if-no-files-found: error
          retention-days: 7
