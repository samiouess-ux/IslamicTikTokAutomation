name: Review staged Quran video backgrounds

on:
  workflow_dispatch:
  push:
    branches:
      - feature/telegram-review-notifications
    paths:
      - ".github/workflows/review-background-candidates.yml"
      - "data/background_additions_review.json"
      - "src/prepare_background_review_previews.py"
      - "src/render_quran_review_previews.py"
      - "content/second_video_ash_sharh_94_1_8_draft.json"
      - "data/reference/surah_ash_sharh_94_1_8_approved.json"
      - "tests/test_background_additions_review.py"
      - "tests/test_prepare_background_review_previews.py"

permissions:
  contents: write

jobs:
  background-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/telegram-review-notifications
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install video inspection tools and approved Arabic font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-hosny-amiri fonts-noto-core
          fc-cache -f
          python -m pip install --disable-pip-version-check pillow
      - name: Test Islamic background catalog and preview safeguards
        run: |
          python -m unittest discover -s tests -p 'test_background_additions_review.py' -v
          python -m unittest discover -s tests -p 'test_prepare_background_review_previews.py' -v
      - name: Render a genuine Quran overlay from the approved verse source
        run: |
          mkdir -p output/background_additions_review
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, "src")
          from render_quran_review_previews import make_frame, font_file

          reference = json.loads(Path("data/reference/surah_ash_sharh_94_1_8_approved.json").read_text(encoding="utf-8"))
          draft = json.loads(Path("content/second_video_ash_sharh_94_1_8_draft.json").read_text(encoding="utf-8"))
          source_arabic = reference["verses"]["94:5"]
          verse = next(v for v in draft["verses"] if v["number"] == 5)
          if verse["arabic"] != source_arabic:
              raise SystemExit("Draft Arabic differs from the approved Tanzil Uthmani reference; refusing overlay.")
          if not verse.get("english"):
              raise SystemExit("Matching reviewed translation is missing; refusing overlay.")
          overlay = Path("output/background_additions_review/quran_overlay_ash_sharh_94_5.png")
          make_frame(verse, 94, 4, overlay, font_file(), reference["surah_name_ar"])
          print(f"Rendered real Quran overlay for Ash-Sharh 94:5: {overlay}")
          PY
      - name: Download and prepare isolated Islamic background previews with Quran overlay
        run: |
          python src/prepare_background_review_previews.py \
            --catalog data/background_additions_review.json \
            --output-dir output/background_additions_review \
            --overlay-frame output/background_additions_review/quran_overlay_ash_sharh_94_5.png
      - name: Publish lightweight review images to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/background_additions_review/*.jpg output/background_additions_review/background_review_report.json
          if git diff --cached --quiet; then
            echo "No review images changed."
          else
            git commit -m "Publish Quran overlay background review previews"
            git push origin HEAD:feature/telegram-review-notifications
          fi
      - name: Upload review contact sheets and verified source clips
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: quran-islamic-background-review
          path: output/background_additions_review/
          if-no-files-found: error
          retention-days: 7
