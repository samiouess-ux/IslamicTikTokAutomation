name: Review staged Quran video backgrounds

on:
  workflow_dispatch:
  push:
    branches:
      - feature/telegram-review-notifications
    paths:
      - ".github/workflows/review-background-candidates.yml"
      - "data/background_additions_review.json"
      - "src/prepare_background_review_previews.py"
      - "tests/test_background_additions_review.py"
      - "tests/test_prepare_background_review_previews.py"

permissions:
  contents: read

jobs:
  background-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/telegram-review-notifications
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install video inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check pillow
      - name: Test Islamic background catalog and preview safeguards
        run: |
          python -m unittest discover -s tests -p 'test_background_additions_review.py' -v
          python -m unittest discover -s tests -p 'test_prepare_background_review_previews.py' -v
      - name: Download and prepare isolated Islamic background previews
        run: |
          python src/prepare_background_review_previews.py \
            --catalog data/background_additions_review.json \
            --output-dir output/background_additions_review
      - name: Upload review contact sheet and verified source clips
        uses: actions/upload-artifact@v4
        with:
          name: quran-islamic-background-review
          path: output/background_additions_review/
          if-no-files-found: error
          retention-days: 7
