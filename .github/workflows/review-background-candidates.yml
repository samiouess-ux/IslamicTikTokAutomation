name: Review approved Quran video backgrounds

on:
  workflow_dispatch:
  push:
    branches:
      - feature/telegram-review-notifications
    paths:
      - ".github/workflows/review-background-candidates.yml"
      - "data/background_additions_review.json"
      - "src/prepare_background_review_previews.py"
      - "src/render_quran_review_previews.py"
      - "content/second_video_ash_sharh_94_1_8_draft.json"
      - "data/reference/surah_ash_sharh_94_1_8_approved.json"
      - "tests/test_background_additions_review.py"
      - "tests/test_background_candidates.py"
      - "tests/test_background_rotation.py"
      - "tests/test_prepare_background_review_previews.py"
      - "src/background_rotation.py"
      - "src/render_video_scenes.py"
      - ".github/workflows/render-manifest-video.yml"

permissions:
  contents: write

jobs:
  background-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/telegram-review-notifications
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install video inspection tools and approved Arabic font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-hosny-amiri fonts-noto-core
          fc-cache -f
          python -m pip install --disable-pip-version-check pillow
      - name: Test Islamic background catalog and preview safeguards
        run: |
          python -m unittest discover -s tests -p 'test_background_additions_review.py' -v
          python -m unittest discover -s tests -p 'test_background_candidates.py' -v
          python -m unittest discover -s tests -p 'test_background_rotation.py' -v
          python -m unittest discover -s tests -p 'test_prepare_background_review_previews.py' -v
          python -m py_compile src/background_rotation.py src/render_video_scenes.py
      - name: Render a genuine Quran overlay from the approved verse source
        run: |
          mkdir -p output/background_additions_review
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, "src")
          from render_quran_review_previews import make_frame, font_file

          reference = json.loads(Path("data/reference/surah_ash_sharh_94_1_8_approved.json").read_text(encoding="utf-8"))
          draft = json.loads(Path("content/second_video_ash_sharh_94_1_8_draft.json").read_text(encoding="utf-8"))
          source_arabic = reference["verses"]["94:5"]
          verse = next(v for v in draft["verses"] if v["number"] == 5)
          if verse["arabic"] != source_arabic:
              raise SystemExit("Draft Arabic differs from the approved Tanzil Uthmani reference; refusing overlay.")
          if not verse.get("english"):
              raise SystemExit("Matching reviewed translation is missing; refusing overlay.")
          overlay = Path("output/background_additions_review/quran_overlay_ash_sharh_94_5.png")
          make_frame(verse, 94, 4, overlay, font_file(), reference["surah_name_ar"])
          print(f"Rendered real Quran overlay for Ash-Sharh 94:5: {overlay}")
          PY
      - name: Download and prepare isolated Islamic background previews with Quran overlay
        run: |
          python src/prepare_background_review_previews.py \
            --catalog data/background_candidates.json \
            --output-dir output/background_additions_review \
            --overlay-frame output/background_additions_review/quran_overlay_ash_sharh_94_5.png \
            --include-id pexels-mosque-architecture-28899957 \
            --include-id pexels-ancient-mosque-architecture-36628576 \
            --include-id pexels-ancient-mosque-architecture-36628576 \
            --include-id pexels-mosque-architecture-28899957
      - name: Activate only the two explicitly approved, downloaded, ffprobe-verified portrait clips
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          review = json.loads(Path("output/background_additions_review/background_review_report.json").read_text(encoding="utf-8"))
          target_ids = {
              "pexels-mosque-architecture-28899957",
              "pexels-ancient-mosque-architecture-36628576",
              "pexels-ancient-mosque-architecture-36628576",
              "pexels-mosque-architecture-28899957",
          }
          items = {item["id"]: item for item in review.get("items", [])}
          missing = target_ids - set(items)
          failed = {asset_id for asset_id in target_ids if asset_id in items and not (
              items[asset_id].get("download_probe_verified") is True
              and items[asset_id].get("user_approved") is True
              and items[asset_id].get("direct_video_url", "").startswith("https://videos.pexels.com/video-files/")
              and items[asset_id].get("width", 0) > 0
              and items[asset_id].get("height", 0) > 0
              and abs(items[asset_id]["width"] / items[asset_id]["height"] - 9/16) < 0.002
              and items[asset_id].get("duration_seconds", 0) > 0
          )}
          if missing or failed:
              raise SystemExit(f"Refusing activation; missing={sorted(missing)}, failed verification={sorted(failed)}")

          catalog_path = Path("data/background_candidates.json")
          catalog = json.loads(catalog_path.read_text(encoding="utf-8"))
          candidates = catalog.setdefault("candidates", [])
          for asset_id in sorted(target_ids):
              item = items[asset_id]
              candidate = {
                  "id": asset_id,
                  "category": "nature" if asset_id == "pexels-ancient-mosque-architecture-36628576" else "mosque_exterior",
                  "description": item["description"],
                  "creator": item.get("creator") or "Pexels contributor",
                  "source_page_url": item["source_page_url"],
                  "license": "Pexels License — source page marked Free",
                  "dimensions": f'{item["width"]}x{item["height"]}',
                  "aspect_ratio": "9:16",
                  "duration_seconds": item["duration_seconds"],
                  "direct_video_url": item["direct_video_url"],
                  "download_verified": True,
                  "approved": True,
                  "user_approved": True,
                  "notes": "User approved the visual overlay preview on 2026-11-23. MP4 download, ffprobe metadata and 9:16 portrait dimensions verified by GitHub Actions. Renderer uses the original video with center crop; existing background rotation and 30% zoom settings are unchanged. User approved this exact Quran-overlay preview on 2026-11-23.",
              }
              existing = next((entry for entry in candidates if entry.get("id") == asset_id), None)
              if existing:
                  existing.update(candidate)
              else:
                  candidates.append(candidate)
          catalog_path.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          from src.background_rotation import load_eligible_backgrounds
          eligible = load_eligible_backgrounds(catalog_path)
          eligible_new = target_ids.intersection(item["id"] for item in eligible)
          if eligible_new != target_ids:
              raise SystemExit(f"Rotation eligibility check failed: {sorted(eligible_new)}")
          print("All two approved clips are now eligible for the existing background rotation.")
          print("No renderer settings, existing candidates or Telegram settings were changed.")
          PY

      - name: Publish lightweight review images to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/background_additions_review/*.jpg output/background_additions_review/background_review_report.json data/background_candidates.json
          if git diff --cached --quiet; then
            echo "No review images changed."
          else
            git commit -m "Publish Quran overlay background review previews"
            git push origin HEAD:feature/telegram-review-notifications
          fi
      - name: Upload review contact sheets and verified source clips
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: quran-islamic-background-review
          path: output/background_additions_review/
          if-no-files-found: error
          retention-days: 7
