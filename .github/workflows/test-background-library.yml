name: Test shared Quran background library

on:
  push:
    branches:
      - feature/telegram-review-notifications
    paths:
      - ".github/workflows/test-background-library.yml"
      - "src/background_library.py"
      - "src/background_rotation.py"
      - "tests/test_background_library.py"
      - "tests/test_background_rotation.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  background-library-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the project branch
        uses: actions/checkout@v4
        with:
          ref: feature/telegram-review-notifications
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Test shared photo and video background library
        run: python -m unittest discover -s tests -p 'test_background_library.py' -v
      - name: Test existing video background rotation
        run: python -m unittest discover -s tests -p 'test_background_rotation.py' -v
      - name: Compile isolated library modules
        run: python -m py_compile src/background_library.py src/background_rotation.py
