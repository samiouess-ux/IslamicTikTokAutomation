name: Test shared Quran background library

on:
  push:
    branches:
      - feature/telegram-review-notifications
    paths:
      - ".github/workflows/test-background-library.yml"
      - "src/background_library.py"
      - "src/background_rotation.py"
      - "tests/test_background_library.py"
      - "tests/test_background_rotation.py"
      - "src/background_review_adapter.py"
      - "tests/test_background_review_adapter.py"
      - "src/background_mixed_renderer.py"
      - "tests/test_background_mixed_renderer.py"
      - "src/render_video_scenes.py"
      - "data/background_photos_manifest.json"
      - "src/download_approved_photo_assets.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  background-library-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the project branch
        uses: actions/checkout@v4
        with:
          ref: feature/telegram-review-notifications
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check pillow
      - name: Test shared photo and video background library
        run: python -m unittest discover -s tests -p 'test_background_library.py' -v
      - name: Test review-only photo and video adapter
        run: python -m unittest discover -s tests -p 'test_background_review_adapter.py' -v
      - name: Test mixed photo/video background renderer
        run: python -m unittest discover -s tests -p 'test_background_mixed_renderer.py' -v
      - name: Test existing video background rotation
        run: python -m unittest discover -s tests -p 'test_background_rotation.py' -v
      - name: Compile isolated library and review adapter modules
        run: python -m py_compile src/background_library.py src/background_rotation.py src/background_review_adapter.py src/background_mixed_renderer.py src/render_video_scenes.py

      - name: Download and compact the six explicitly approved photos
        run: python src/download_approved_photo_assets.py
      - name: Commit optimized approved photo assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/background_photos/
          if git diff --cached --quiet; then
            echo "No new photo assets to commit."
          else
            git commit -m "Add six user-approved compact Quran photo backgrounds"
            git push origin HEAD:feature/telegram-review-notifications
          fi
