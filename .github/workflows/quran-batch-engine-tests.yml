name: Quran batch engine tests

on:
  push:
    branches: [feature/telegram-review-notifications]
    paths:
      - "src/build_quran_review_batch.py"
      - "src/prepare_quran_review_batch_audio.py"
      - "src/quran_audio_parts.py"
      - "src/build_quran_draft_manifests.py"
      - "src/render_quran_review_previews.py"
      - "src/quran_delivery_attempt.py"
      - "src/record_quran_delivery.py"
      - "tests/test_prepare_quran_review_batch_audio.py"
      - "tests/test_quran_audio_parts.py"
      - "tests/test_build_quran_draft_manifests.py"
      - "tests/test_render_quran_review_previews.py"
      - "tests/test_quran_delivery_attempt.py"
      - "tests/test_record_quran_delivery.py"
      - "src/build_quran_video_catalog.py"
      - "src/render_video_scenes.py"
      - "src/render_video.py"
      - "src/render_quran_review_batch.py"
      - "src/validate_content_manifest.py"
      - "src/orchestrator.py"
      - "src/content_rotation.py"
      - "tests/test_build_quran_review_batch.py"
      - "tests/test_build_quran_video_catalog.py"
      - "tests/test_quran_visual_templates.py"
      - "tests/test_render_video_duration.py"
      - "tests/test_render_quran_review_batch.py"
      - "tests/test_orchestrator.py"
      - "tests/test_content_rotation.py"
      - "tests/test_background_reel.py"
      - ".github/workflows/quran-batch-engine-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/telegram-review-notifications
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install renderer test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-hosny-amiri fonts-dejavu-core
          python -m pip install --disable-pip-version-check Pillow remotezip
      - name: Compile Quran engine modules
        run: |
          python -m py_compile \
            src/build_quran_review_batch.py \
            src/prepare_quran_review_batch_audio.py \
            src/quran_audio_parts.py \
            src/build_quran_draft_manifests.py \
            src/render_quran_review_previews.py \
            src/quran_delivery_attempt.py \
            src/record_quran_delivery.py \
            src/build_quran_video_catalog.py \
            src/render_video_scenes.py \
            src/render_video.py \
            src/render_quran_review_batch.py \
            src/validate_content_manifest.py \
            src/orchestrator.py \
            src/content_rotation.py
      - name: Run Quran catalog, batch and visual template tests
        run: |
          python -m unittest -v \
            tests/test_build_quran_review_batch.py \
            tests/test_build_quran_video_catalog.py \
            tests/test_quran_visual_templates.py \
            tests/test_render_video_duration.py \
            tests/test_background_reel.py \
            tests/test_render_quran_review_batch.py \
            tests/test_prepare_quran_review_batch_audio.py \
            tests/test_quran_audio_parts.py \
            tests/test_build_quran_draft_manifests.py \
            tests/test_render_quran_review_previews.py \
            tests/test_quran_delivery_attempt.py \
            tests/test_record_quran_delivery.py
      - name: Test Quran-only daily orchestrator
        run: python -m unittest discover -s tests -p 'test_orchestrator.py' -v
      - name: Confirm workflow is test-only
        run: |
          ! grep -Eq "send_telegram|upload_to_tiktok|publish" .github/workflows/quran-batch-engine-tests.yml
          echo "Test workflow does not render, send Telegram messages, or publish."
