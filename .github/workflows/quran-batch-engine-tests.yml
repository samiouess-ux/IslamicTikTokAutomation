name: Quran batch engine tests

on:
  push:
    branches: [feature/telegram-review-notifications]
    paths:
      - "src/build_quran_review_batch.py"
      - "src/prepare_quran_review_batch_audio.py"
      - "src/quran_audio_parts.py"
      - "src/build_quran_draft_manifests.py"
      - "src/render_quran_review_previews.py"
      - "references/approved_quran_design.png"
      - "src/quran_delivery_attempt.py"
      - "src/record_quran_delivery.py"
      - "tests/test_prepare_quran_review_batch_audio.py"
      - "tests/test_quran_audio_parts.py"
      - "tests/test_build_quran_draft_manifests.py"
      - "tests/test_render_quran_review_previews.py"
      - "tests/test_quran_delivery_attempt.py"
      - "tests/test_record_quran_delivery.py"
      - "src/build_quran_video_catalog.py"
      - "src/render_video_scenes.py"
      - "src/render_video.py"
      - "src/render_quran_review_batch.py"
      - "src/validate_content_manifest.py"
      - "src/orchestrator.py"
      - "src/content_rotation.py"
      - "tests/test_build_quran_review_batch.py"
      - "tests/test_build_quran_video_catalog.py"
      - "tests/test_quran_visual_templates.py"
      - "tests/test_render_video_duration.py"
      - "tests/test_render_quran_review_batch.py"
      - "tests/test_orchestrator.py"
      - "tests/test_content_rotation.py"
      - "tests/test_background_reel.py"
      - ".github/workflows/quran-batch-engine-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/telegram-review-notifications
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install renderer test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-hosny-amiri fonts-dejavu-core
          python -m pip install --disable-pip-version-check Pillow remotezip
      - name: Compile Quran engine modules
        run: |
          python -m py_compile \
            src/build_quran_review_batch.py \
            src/prepare_quran_review_batch_audio.py \
            src/quran_audio_parts.py \
            src/build_quran_draft_manifests.py \
            src/render_quran_review_previews.py \
            src/quran_delivery_attempt.py \
            src/record_quran_delivery.py \
            src/build_quran_video_catalog.py \
            src/render_video_scenes.py \
            src/render_video.py \
            src/render_quran_review_batch.py \
            src/validate_content_manifest.py \
            src/orchestrator.py \
            src/content_rotation.py
      - name: Run Quran catalog, batch and visual template tests
        run: |
          python -m unittest -v \
            tests/test_build_quran_review_batch.py \
            tests/test_build_quran_video_catalog.py \
            tests/test_quran_visual_templates.py \
            tests/test_render_video_duration.py \
            tests/test_background_reel.py \
            tests/test_render_quran_review_batch.py \
            tests/test_prepare_quran_review_batch_audio.py \
            tests/test_quran_audio_parts.py \
            tests/test_build_quran_draft_manifests.py \
            tests/test_render_quran_review_previews.py \
            tests/test_quran_delivery_attempt.py \
            tests/test_record_quran_delivery.py
      - name: Render a reference-driven Quran layout sample (no delivery)
        run: |
          mkdir -p output/quran-reference-layout-preview
          python - <<'PY'
          import sys
          from pathlib import Path
          from PIL import Image, ImageDraw
          sys.path.insert(0, str(Path("src").resolve()))
          from render_quran_review_previews import (
              SURAH_NAMES, font_file, make_frame, make_intro_frame
          )

          output = Path("output/quran-reference-layout-preview")
          background = Image.new("RGB", (1080, 1920))
          pixels = background.load()
          for y in range(1920):
              ratio = y / 1919
              color = (
                  int(22 + 18 * ratio),
                  int(43 + 20 * ratio),
                  int(57 + 24 * ratio),
              )
              for x in range(1080):
                  pixels[x, y] = color
          background_path = output / "sample_background.png"
          background.save(background_path)
          font = font_file()
          surah_name = SURAH_NAMES[17]
          verse = {
              "number": 7,
              "arabic": "إِنَّا جَعَلْنَا مَا عَلَى الْأَرْضِ زِينَةً لَّهَا لِنَبْلُوَهُمْ أَيُّهُمْ أَحْسَنُ عَمَلًا",
              "english": "Indeed, We have made whatever is on the earth adornment for it, that We may test them as to which of them is best in deeds.",
          }
          overlay_path = output / "reference_layout_ayah_7.png"
          make_frame(verse, 18, 0, overlay_path, font, surah_name)
          with Image.open(overlay_path) as overlay:
              composed = background.convert("RGBA")
              composed.alpha_composite(overlay.convert("RGBA"))
              composed.convert("RGB").save(output / "reference_layout_ayah_7_composited.jpg", quality=94)
          make_intro_frame(18, 7, 7, output / "reference_layout_intro.png",
                           font, surah_name, background_frame=background_path)
          print("Rendered reference-driven still previews only; no audio, Telegram, Cron, or TikTok action.")
          PY
      - name: Upload reference-driven Quran layout previews
        uses: actions/upload-artifact@v4
        with:
          name: quran-reference-layout-preview
          path: output/quran-reference-layout-preview/
          if-no-files-found: error
          retention-days: 7
      - name: Test Quran-only daily orchestrator
        run: python -m unittest discover -s tests -p 'test_orchestrator.py' -v
      - name: Confirm workflow is test-only
        run: |
          ! grep -Eq "send_telegram|upload_to_tiktok|publish" .github/workflows/quran-batch-engine-tests.yml
          echo "Test workflow does not render, send Telegram messages, or publish."
