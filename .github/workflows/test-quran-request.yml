name: Test isolated Quran request pipeline

on:
  push:
    branches: [feature/telegram-review-notifications]
    paths:
      - "src/build_requested_quran_passage.py"
      - "tests/test_build_requested_quran_passage.py"
      - "src/parse_telegram_quran_request.py"
      - "src/select_requested_quran_range.py"
      - "tests/test_select_requested_quran_range.py"
      - "cloudflare/telegram-bridge/worker.js"
      - "tests/test_parse_telegram_quran_request.py"
      - "src/telegram_request_inbox.py"
      - "tests/test_telegram_request_inbox.py"
      - "src/telegram_request_state.py"
      - "tests/test_telegram_request_state.py"
      - "src/render_quran_review_previews.py"
      - "tests/test_render_quran_review_previews.py"
      - ".github/workflows/test-quran-request.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  request-pipeline-tests:
    if: github.ref != 'refs/heads/feature/quran-video-pro'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install rendering test dependencies
        run: python -m pip install --disable-pip-version-check pillow remotezip
      - name: Check Cloudflare webhook bridge JavaScript syntax
        run: node --input-type=module --check < cloudflare/telegram-bridge/worker.js
      - name: Test Telegram request parser
        run: python -m unittest discover -s tests -p 'test_parse_telegram_quran_request.py' -v
      - name: Test safe ayah-range selection for whole-surah requests
        run: python -m unittest discover -s tests -p 'test_select_requested_quran_range.py' -v
      - name: Test authorized Telegram inbox
        run: python -m unittest discover -s tests -p 'test_telegram_request_inbox.py' -v
      - name: Test Telegram request persistence and deduplication
        run: python -m unittest discover -s tests -p 'test_telegram_request_state.py' -v
      - name: Test exact requested Quran passages
        run: python -m unittest discover -s tests -p 'test_build_requested_quran_passage.py' -v
      - name: Test single and daily review rendering modes
        run: python -m unittest discover -s tests -p 'test_render_quran_review_previews.py' -v
