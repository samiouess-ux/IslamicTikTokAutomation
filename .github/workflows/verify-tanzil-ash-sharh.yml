name: Verify Tanzil Ash-Sharh 94:1-8

on:
  push:
    branches:
      - research/alternate-backgrounds
    paths:
      - .github/workflows/verify-tanzil-ash-sharh.yml

permissions:
  contents: read

jobs:
  verify-source:
    runs-on: ubuntu-latest
    steps:
      - name: Download original Tanzil Uthmani v1.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import hashlib
          import urllib.parse
          import urllib.request
          from pathlib import Path

          url = "https://tanzil.net/pub/download/index.php"
          form = urllib.parse.urlencode({
              "quranType": "uthmani",
              "outType": "txt-2",
              "marks": "true",
              "sajdah": "true",
              "tatweel": "true",
              "agree": "true",
          }).encode("ascii")
          request = urllib.request.Request(
              url,
              data=form,
              headers={
                  "Content-Type": "application/x-www-form-urlencoded",
                  "User-Agent": "IslamicTikTokAutomation-source-verification/1.0",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              raw = response.read()
              content_type = response.headers.get("Content-Type", "")
              final_url = response.geturl()

          if not raw or len(raw) < 100_000:
              raise SystemExit(f"Unexpectedly small download: {len(raw)} bytes")
          if b"<html" in raw[:1000].lower() or b"<!doctype" in raw[:1000].lower():
              raise SystemExit("Server returned HTML instead of the text file")
          decoded = raw.decode("utf-8-sig")
          records = [
              line for line in decoded.splitlines()
              if line and not line.lstrip().startswith("#") and len(line.split("|", 2)) == 3
          ]
          if len(records) < 6000:
              raise SystemExit(f"Unexpected text format or incomplete Quran dataset: {len(records)} records")
          if not any(line.split("|", 2)[:2] == ["94", "1"] for line in records):
              raise SystemExit("Downloaded text does not contain the expected 94|1 record")

          Path("output/tanzil_uthmani_v1.1_original.txt").write_bytes(raw)
          print("Final URL:", final_url)
          print("Content-Type:", content_type)
          print("Bytes:", len(raw))
          print("Parseable verse records:", len(records))
          print("First bytes:", repr(raw[:160]))
          print("SHA-256:", hashlib.sha256(raw).hexdigest())
          PY

      - name: Extract verses 94:1-8 without Unicode normalization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          raw = Path("output/tanzil_uthmani_v1.1_original.txt").read_bytes()
          text = raw.decode("utf-8")
          found = {}
          for line in text.splitlines():
              if not line or line.startswith("#"):
                  continue
              parts = line.split("|", 2)
              if len(parts) != 3:
                  continue
              surah, ayah, arabic = parts
              if surah == "94" and ayah in {str(i) for i in range(1, 9)}:
                  if ayah in found:
                      raise SystemExit(f"Duplicate source verse 94:{ayah}")
                  found[ayah] = arabic

          expected = [str(i) for i in range(1, 9)]
          if list(sorted(found, key=int)) != expected:
              raise SystemExit(f"Expected verses 1-8; found {sorted(found, key=int)}")

          # Tanzil's txt-2 dataset prefixes the basmala to the first ayah
          # of this surah. Separate only this exact known prefix; do not
          # normalize, rewrite, or otherwise modify the Quranic text.
          basmala = "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ"
          first = found["1"]
          exact_prefix = basmala + " "
          if not first.startswith(exact_prefix):
              raise SystemExit("Expected exact basmala prefix not found in 94:1")
          found["1"] = first[len(exact_prefix):]
          if not found["1"]:
              raise SystemExit("Verse 94:1 is empty after separating basmala")

          output = {
              "source": "Tanzil Quran Text (Uthmani, Version 1.1)",
              "source_url": "https://tanzil.net/download/",
              "download_endpoint": "https://tanzil.net/pub/download/index.php",
              "format": "UTF-8, txt-2, marks/sajdah/tatweel enabled",
              "review_status": "source_downloaded_not_yet_human_approved",
              "raw_file_sha256": hashlib.sha256(raw).hexdigest(),
              "unicode_normalization": "none",
              "basmala_separate": basmala,
              "basmala_handling": "exact prefix separated from the source record for 94:1; verse text preserved byte-for-byte after prefix",
              "verses": {f"94:{i}": found[str(i)] for i in range(1, 9)},
          }
          Path("output/ash_sharh_94_1_8_source_extract.json").write_text(
              json.dumps(output, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(output, ensure_ascii=False, indent=2))
          PY

      - name: Upload source and exact extraction for human review
        uses: actions/upload-artifact@v4
        with:
          name: tanzil-ash-sharh-94-1-8-source-review
          path: |
            output/tanzil_uthmani_v1.1_original.txt
            output/ash_sharh_94_1_8_source_extract.json
          retention-days: 7
