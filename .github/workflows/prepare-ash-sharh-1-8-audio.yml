name: Prepare Ash-Sharh verses 1-8 audio review

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prepare-ash-sharh-1-8-audio.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-audio-review:
    if: github.ref != 'refs/heads/feature/quran-video-pro'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inspect official archive and extract verses 1-8
        run: |
          python -m pip install --disable-pip-version-check remotezip
          mkdir -p output
          python - <<'PY'
          from remotezip import RemoteZip
          from pathlib import Path
          import hashlib, json

          url = "https://download.qurancomplex.gov.sa/new-sounds/muaiqly-08/hafs/ayat-12-1-2020.zip"
          prefix = "ayat-12-1-2020/094 Ash-Sharh ƒΘ¼⌐Ñ/"
          with RemoteZip(url) as archive:
              names = archive.namelist()
              matches = {}
              for verse in range(1, 9):
                  suffix = f"10-094{verse:03d}-A08.mp3"
                  found = [n for n in names if n.endswith(suffix) and n.startswith(prefix)]
                  if len(found) != 1:
                      raise RuntimeError(f"Expected exactly one archive entry for verse {verse}; found: {found}")
                  member = found[0]
                  destination = Path("output") / f"verse_{verse:02d}.mp3"
                  info = archive.getinfo(member)
                  with archive.open(member) as source, destination.open("wb") as target:
                      while chunk := source.read(1024 * 1024):
                          target.write(chunk)
                  digest = hashlib.sha256(destination.read_bytes()).hexdigest()
                  matches[str(verse)] = {"archive_entry": member, "file": destination.name,
                      "bytes": destination.stat().st_size, "sha256": digest}
                  print(f"Verse {verse}: {member}; {destination.stat().st_size} bytes; SHA-256 {digest}")
          Path("output/archive_inventory.json").write_text(json.dumps({
              "source": url, "collection": "King Fahd Complex official Hafs archive",
              "verses": matches, "review_status": "awaiting_user_listening_approval"
          }, ensure_ascii=False, indent=2), encoding="utf-8")
          PY

      - name: Join original MP3 files in verse order without re-encoding
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          for n in 01 02 03 04 05 06 07 08; do echo "file 'verse_${n}.mp3'"; done > output/concat.txt
          cd output
          ffmpeg -hide_banner -y -f concat -safe 0 -i concat.txt -c copy ash_sharh_94_1_8_audio_review.mp3
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 ash_sharh_94_1_8_audio_review.mp3
          sha256sum ash_sharh_94_1_8_audio_review.mp3

      - name: Upload audio review package
        uses: actions/upload-artifact@v4
        with:
          name: ash-sharh-94-1-8-audio-review
          path: |
            output/verse_*.mp3
            output/ash_sharh_94_1_8_audio_review.mp3
            output/archive_inventory.json
          if-no-files-found: error
          retention-days: 7
