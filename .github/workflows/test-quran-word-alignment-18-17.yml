name: Isolated Quran word-alignment test (18:17)

on:
  push:
    branches:
      - test/quran-word-alignment-18-17

permissions:
  contents: read

jobs:
  align-ayah-18-17:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out isolated test branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install word aligner
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/voltarostudio/quran-word-align.git"

      - name: Download Maher Al-Muaiqly recording from MP3Quran
        run: |
          mkdir -p test-audio
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://cdn.mp3quran.net/audio/maher-muaiqly/r1/018.mp3" \
            --output test-audio/018.mp3
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 test-audio/018.mp3

      - name: Align the full surah and extract ayah 17 only
        run: |
          quran-word-align file test-audio/018.mp3 18 --riwayah hafs --out aligned --format json
          python - <<'PY'
          import json
          from pathlib import Path
          from quran_word_align.align import mushaf_words

          source = json.loads(Path("aligned/018.json").read_text(encoding="utf-8"))
          ayah_events = source.get("17", source.get(17, []))
          words = dict(mushaf_words("hafs")[(18, 17)])
          events = [
              {
                  "word_number": int(word_no),
                  "arabic": words.get(int(word_no), ""),
                  "start_ms": int(start_ms),
                  "end_ms": int(end_ms),
                  "confidence": float(confidence),
              }
              for word_no, start_ms, end_ms, confidence in ayah_events
          ]
          report = {
              "surah": 18,
              "ayah": 17,
              "reciter": "Maher Al-Muaiqly",
              "riwayah": "Hafs",
              "source_audio": "MP3Quran: cdn.mp3quran.net/audio/maher-muaiqly/r1/018.mp3",
              "event_count_including_repeats": len(events),
              "distinct_mushaf_words": len(words),
              "events": events,
          }
          Path("ayah-18-17-word-timings.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps({
              "ayah": "18:17",
              "timed_word_events": len(events),
              "distinct_mushaf_words": len(words),
              "low_confidence_events_below_0_5": sum(e["confidence"] < 0.5 for e in events),
              "repeat_events": max(0, len(events) - len({e["word_number"] for e in events})),
          }, ensure_ascii=False))
          if not events:
              raise SystemExit("No word timings were produced for ayah 18:17")
          PY

      - name: Publish test report as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: quran-word-timings-18-17
          path: ayah-18-17-word-timings.json
          if-no-files-found: error
          retention-days: 7
