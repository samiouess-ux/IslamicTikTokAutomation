name: Isolated Quran repeat-detection test (Al-Kahf)

on:
  push:
    branches:
      - test/quran-repeat-detection

permissions:
  contents: read

jobs:
  align-full-surah-and-find-repeats:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out isolated test branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install word aligner
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/voltarostudio/quran-word-align.git"

      - name: Download Maher Al-Muaiqly recording from MP3Quran
        run: |
          mkdir -p test-audio
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://cdn.mp3quran.net/audio/maher-muaiqly/r1/018.mp3" \
            --output test-audio/018.mp3

      - name: Align the full surah and identify repeated recitation events
        run: |
          quran-word-align file test-audio/018.mp3 18 --riwayah hafs --out aligned --format json
          python - <<'PY'
          import json
          from pathlib import Path
          from quran_word_align.align import mushaf_words

          source = json.loads(Path("aligned/018.json").read_text(encoding="utf-8"))
          mushaf = mushaf_words("hafs")
          summaries = []
          repeat_candidates = []

          for ayah_number in range(1, 111):
              raw_events = source.get(str(ayah_number), source.get(ayah_number, []))
              expected = dict(mushaf[(18, ayah_number)])
              events = [
                  {
                      "word_number": int(word_no),
                      "arabic": expected.get(int(word_no), ""),
                      "start_ms": int(start_ms),
                      "end_ms": int(end_ms),
                      "confidence": float(confidence),
                  }
                  for word_no, start_ms, end_ms, confidence in raw_events
              ]
              repeated = max(0, len(events) - len({e["word_number"] for e in events}))
              summary = {
                  "ayah": f"18:{ayah_number}",
                  "timed_word_events": len(events),
                  "distinct_mushaf_words": len(expected),
                  "repeat_events": repeated,
                  "low_confidence_events_below_0_5": sum(e["confidence"] < 0.5 for e in events),
                  "missing_mushaf_words": sorted(set(expected) - {e["word_number"] for e in events}),
              }
              summaries.append(summary)
              if repeated:
                  repeat_candidates.append({
                      **summary,
                      "events": events,
                  })

          # Prefer the ayah with the most repeated word events; retain 18:17
          # as a fallback reference if this recitation contains no detectable repeats.
          if repeat_candidates:
              selected = max(repeat_candidates, key=lambda item: item["repeat_events"])
              has_repeats = True
          else:
              selected_ayah = 17
              raw_events = source.get(str(selected_ayah), source.get(selected_ayah, []))
              expected = dict(mushaf[(18, selected_ayah)])
              events = [
                  {
                      "word_number": int(word_no),
                      "arabic": expected.get(int(word_no), ""),
                      "start_ms": int(start_ms),
                      "end_ms": int(end_ms),
                      "confidence": float(confidence),
                  }
                  for word_no, start_ms, end_ms, confidence in raw_events
              ]
              selected = next(item for item in summaries if item["ayah"] == "18:17")
              selected = {**selected, "events": events}
              has_repeats = False

          report = {
              "surah": 18,
              "reciter": "Maher Al-Muaiqly",
              "riwayah": "Hafs",
              "source_audio": "MP3Quran: cdn.mp3quran.net/audio/maher-muaiqly/r1/018.mp3",
              "has_detected_repeats": has_repeats,
              "selected_ayah": selected["ayah"],
              "selected_ayah_events": selected["events"],
              "ayah_summaries": summaries,
              "repeat_candidates": [
                  {key: value for key, value in item.items() if key != "events"}
                  for item in repeat_candidates
              ],
          }
          Path("quran-repeat-detection-report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps({
              "surah": 18,
              "ayahs_aligned": len(summaries),
              "ayahs_with_repeat_events": len(repeat_candidates),
              "selected_ayah": selected["ayah"],
              "selected_repeat_events": selected["repeat_events"],
              "selected_low_confidence_events": selected["low_confidence_events_below_0_5"],
              "selected_missing_mushaf_words": len(selected["missing_mushaf_words"]),
          }, ensure_ascii=False))
          PY

      - name: Publish isolated repeat-detection report
        uses: actions/upload-artifact@v4
        with:
          name: quran-repeat-detection-al-kahf
          path: quran-repeat-detection-report.json
          if-no-files-found: error
          retention-days: 7
