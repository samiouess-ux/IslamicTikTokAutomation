name: Saad Al-Ghamdi matched-source timing validation

on:
  push:
    branches:
      - experiment/saad-ghamdi-audio-source
    paths:
      - ".github/workflows/saad-ghamdi-cross-surah-audio-check.yml"
      - "scripts/diagnostics/check_saad_qua_matched_source.py"

permissions:
  contents: read

jobs:
  validate-matched-source-timestamps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out isolated experiment
        uses: actions/checkout@v4
        with:
          ref: experiment/saad-ghamdi-audio-source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ensure ffmpeg and requests are available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=20
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          python -m pip install --disable-pip-version-check requests

      - name: Verify all canonical intervals against their declared source audio
        run: |
          python scripts/diagnostics/check_saad_qua_matched_source.py

      - name: Publish acoustic screening CSV in run summary
        if: always()
        run: |
          {
            echo "## Saad Al-Ghamdi acoustic screening report"
            echo
            if [ -f saad_human_listening_review.md ]; then
              cat saad_human_listening_review.md
              echo
            fi
            if [ -f saad_acoustic_probe.csv ]; then
              echo 'CSV report (all screened ayah intervals):'
              echo
              echo '~~~csv'
              cat saad_acoustic_probe.csv
              echo '~~~'
            else
              echo "The diagnostic did not produce saad_acoustic_probe.csv."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

# Isolated validation only; never changes production audio or approval state.
