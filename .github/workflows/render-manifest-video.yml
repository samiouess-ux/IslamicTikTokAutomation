name: Render manifest video for review

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: Repository path to a reviewed content JSON manifest
        required: true
        default: content/first_video.json
        type: string
      use_rotation:
        description: Select an eligible reviewed manifest instead of the explicit path
        required: false
        default: false
        type: boolean
      content_type:
        description: Content type for reviewed-manifest rotation
        required: false
        default: quran
        type: choice
        options: [quran, dua, dhikr]
      recent_manifest_ids:
        description: Newline-separated manifest IDs already used
        required: false
        default: ''
        type: string
      rotation_key:
        description: Stable key for deterministic selection
        required: false
        default: manual-review
        type: string
      compare_designs:
        description: Render two review-only visual designs from the same audio, manifest, and downloaded background
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  render:
    if: github.ref != 'refs/heads/feature/quran-video-pro'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-hosny-amiri fonts-noto-core fonts-dejavu-core
          fc-cache -f
          python - <<'PY'
          import subprocess
          match = subprocess.check_output(['fc-match', '-f', '%{family}|%{style}|%{file}', 'Amiri:style=Bold'], text=True).strip()
          print('Resolved approved Arabic font:', match)
          family, style, path = match.split('|', 2)
          if 'Amiri' not in family or 'Bold' not in style or not path.endswith(('.ttf', '.otf')):
              raise SystemExit('Required Amiri Bold font is unavailable; refusing to render with a fallback font.')
          PY
          pip install remotezip pillow requests
          python --version
          ffmpeg -version | head -n 1

      - name: Select reviewed manifest (optional rotation)
        id: selection
        shell: bash
        env:
          USE_ROTATION: ${{ inputs.use_rotation }}
          CONTENT_TYPE: ${{ inputs.content_type }}
          RECENT_IDS: ${{ inputs.recent_manifest_ids }}
          ROTATION_KEY: ${{ inputs.rotation_key }}
          EXPLICIT_MANIFEST: ${{ inputs.manifest }}
        run: |
          if [ "$USE_ROTATION" = "true" ]; then
            args=(--content-type "$CONTENT_TYPE" --rotation-key "$ROTATION_KEY")
            while IFS= read -r item; do
              [ -n "$item" ] && args+=(--recent-id "$item")
            done <<< "$RECENT_IDS"
            selected=$(python src/select_review_manifest.py "${args[@]}")
          else
            selected="${EXPLICIT_MANIFEST:-content/first_video.json}"
          fi
          echo "manifest=$selected" >> "$GITHUB_OUTPUT"
          echo "Selected review manifest: $selected"

      - name: Validate Quran reference snapshot structure
        run: |
          python src/validate_quran_reference.py data/reference/quran_text_uthmani.json

      - name: Run Quran validation regression tests
        run: |
          python -m unittest discover -s tests -v

      - name: Validate exact Quran Arabic text
        shell: bash
        run: |
          manifest='${{ steps.selection.outputs.manifest }}'
          if [ "$manifest" = 'content/second_video_ash_sharh_94_1_8_draft.json' ]; then
            python src/validate_quran_text.py --manifest "$manifest" --reference data/reference/surah_ash_sharh_94_1_8_approved.json
          else
            python src/validate_quran_text.py --manifest "$manifest"
          fi

      - name: Prepare review-only Ash-Sharh candidate audio and per-verse timing
        if: steps.selection.outputs.manifest == 'content/second_video_ash_sharh_94_1_8_draft.json'
        shell: bash
        run: |
          python - <<'PY'
          from remotezip import RemoteZip
          from pathlib import Path
          import json, subprocess

          url = 'https://download.qurancomplex.gov.sa/new-sounds/muaiqly-08/hafs/ayat-12-1-2020.zip'
          work = Path('build/audio/processed')
          work.mkdir(parents=True, exist_ok=True)
          durations = {}
          with RemoteZip(url) as archive:
              names = archive.namelist()
              for verse in range(1, 9):
                  suffix = f'10-094{verse:03d}-A08.mp3'
                  matches = [n for n in names if n.endswith(suffix)]
                  if len(matches) != 1:
                      raise RuntimeError(f'Expected one official source for verse {verse}, got {matches}')
                  source = work / f'original_{verse:02d}.mp3'
                  with archive.open(matches[0]) as src, source.open('wb') as dst:
                      while chunk := src.read(1024 * 1024): dst.write(chunk)
                  processed = work / f'verse_{verse:02d}.mp3'
                  subprocess.run(['ffmpeg','-hide_banner','-y','-i',str(source),'-c:a','libmp3lame','-q:a','2',str(processed)],check=True)
                  duration = float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',str(processed)],text=True).strip())
                  durations[str(verse)] = duration
          concat = work / 'concat.txt'
          concat.write_text(''.join(f"file '{(work / f'verse_{n:02d}.mp3').resolve()}'\n" + ("file 'silence_020ms.mp3'\n" if n < 8 else '') for n in range(1,9)), encoding='utf-8')
          silence = work / 'silence_020ms.mp3'
          subprocess.run(['ffmpeg','-hide_banner','-y','-f','lavfi','-i','anullsrc=r=44100:cl=stereo','-t','0.02','-c:a','libmp3lame','-q:a','2',str(silence)],check=True)
          # Rebuild concat list now that the inter-verse silence asset exists.
          concat.write_text(''.join(f"file '{(work / f'verse_{n:02d}.mp3').resolve()}'\n" + (f"file '{silence.resolve()}'\n" if n < 8 else '') for n in range(1,9)), encoding='utf-8')
          output = Path('output/ash_sharh_94_1_8_approved_audio.mp3')
          output.parent.mkdir(parents=True, exist_ok=True)
          subprocess.run(['ffmpeg','-hide_banner','-y','-f','concat','-safe','0','-i',str(concat),'-c:a','libmp3lame','-q:a','2',str(output)],check=True)
          manifest = json.loads(Path('content/second_video_ash_sharh_94_1_8_draft.json').read_text(encoding='utf-8'))
          manifest['audio']['production_audio_file'] = str(output)
          manifest['audio']['processed_verse_durations_seconds'] = durations
          manifest['audio']['inter_verse_silence_seconds'] = 0.02
          Path('build/manifest_for_render.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          print('Processed verse durations:', json.dumps(durations,sort_keys=True))
          print('Production audio duration:', subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',str(output)],text=True).strip())
          PY

      - name: Extract Al-Ikhlas exact official recitation for listening review only
        if: steps.selection.outputs.manifest == 'content/candidate_surah_al_ikhlas_112_1_4.json'
        shell: bash
        run: |
          python - <<'PY'
          from remotezip import RemoteZip
          from pathlib import Path
          import subprocess

          url = 'https://download.qurancomplex.gov.sa/new-sounds/muaiqly-08/hafs/ayat-12-1-2020.zip'
          out = Path('output/al_ikhlas_audio_review')
          out.mkdir(parents=True, exist_ok=True)
          with RemoteZip(url) as archive:
              names = archive.namelist()
              for verse in range(1, 5):
                  suffix = f'10-112{verse:03d}-A08.mp3'
                  matches = [name for name in names if name.endswith(suffix)]
                  if len(matches) != 1:
                      raise RuntimeError(f'Expected exactly one archive entry ending {suffix}; found: {matches}')
                  target = out / f'al_ikhlas_112_{verse:03d}_source.mp3'
                  with archive.open(matches[0]) as source, target.open('wb') as dest:
                      while chunk := source.read(1024 * 1024):
                          dest.write(chunk)
                  duration = subprocess.check_output(
                      ['ffprobe', '-v', 'error', '-show_entries', 'format=duration',
                       '-of', 'default=nw=1:nk=1', str(target)], text=True).strip()
                  print(f'Verse {verse}: archive entry={matches[0]} duration={duration}s bytes={target.stat().st_size}')
          print('These are unmodified source clips for user listening review only; no production approval is implied.')
          PY

      - name: Prepare exact approved Ash-Sharh 94:5-6 audio
        if: steps.selection.outputs.manifest == 'content/first_video.json'
        shell: bash
        run: |
          python src/build_official_audio_inventory.py output/official_verse_audio_inventory.json
          python - <<'PY'
          from pathlib import Path
          import json, subprocess, zipfile, sys
          from remotezip import RemoteZip, RangeNotSupported
          sys.path.insert(0, 'src')
          from build_official_audio_inventory import create_archive_session, download_verified_archive

          inventory = json.loads(Path('output/official_verse_audio_inventory.json').read_text(encoding='utf-8'))
          if inventory.get('reciter_internal') != 'Maher Al-Muaiqly' or inventory.get('recitation') != 'Hafs':
              raise SystemExit('Refusing audio source: expected Maher Al-Muaiqly, Hafs.')
          if inventory.get('mapped_verse_count') != 6236:
              raise SystemExit('Refusing incomplete official audio inventory.')
          if inventory.get('expected_official_sha256') != '3edcc70407f9d19c972c002c69a43cc245a62a0fcc497d3c719406a69965e18e':
              raise SystemExit('Pinned KFGQPC archive checksum mismatch.')
          work = Path('build/audio')
          work.mkdir(parents=True, exist_ok=True)
          durations = {}
          def extract_selected_verses(archive):
              for verse in (5, 6):
                  key = f'94:{verse}'
                  member = inventory['verses'].get(key)
                  if not member:
                      raise RuntimeError(f'Missing exact official inventory entry for {key}.')
                  expected_basename = f'10-{94:03d}{verse:03d}-A08.mp3'
                  if member.rsplit('/', 1)[-1].casefold() != expected_basename.casefold():
                      raise RuntimeError(f'Inventory member basename mismatch for {key}: {member}')
                  # ZIP directory names may decode non-ASCII text differently from
                  # the upstream JSON manifest. Resolve by the canonical ASCII verse
                  # filename, and require exactly one match before reading any bytes.
                  matches = [name for name in archive.namelist()
                             if name.rsplit('/', 1)[-1].casefold() == expected_basename.casefold()]
                  if len(matches) != 1:
                      raise RuntimeError(
                          f'Expected exactly one ZIP member named {expected_basename}; found {matches}'
                      )
                  zip_member = matches[0]
                  target = work / f'verse_{verse:02d}.mp3'
                  with archive.open(zip_member) as src, target.open('wb') as dst:
                      while chunk := src.read(1024 * 1024):
                          dst.write(chunk)
                  if target.stat().st_size < 1024:
                      raise RuntimeError(f'Audio member {member} is unexpectedly small.')
                  durations[str(verse)] = float(subprocess.check_output([
                      'ffprobe','-v','error','-show_entries','format=duration',
                      '-of','default=nw=1:nk=1',str(target)
                  ],text=True).strip())
                  if durations[str(verse)] <= 0:
                      raise RuntimeError(f'Invalid duration for official verse {verse}.')
                  print(f'CRC-read verified official member {zip_member}: {target.stat().st_size} bytes, {durations[str(verse)]:.3f}s')

          archive_path = inventory.get('archive_path')
          try:
              archive_context = zipfile.ZipFile(archive_path) if archive_path else RemoteZip(inventory['source_url'])
              with archive_context as archive:
                  extract_selected_verses(archive)
          except RangeNotSupported:
              if archive_path:
                  raise
              print('Mirror advertised range support but rejected ZIP range reads; falling back to a full checksum-verified archive download.')
              session = create_archive_session()
              try:
                  archive_path = download_verified_archive(
                      session, inventory['source_url'], work / 'kfgqpc_maher_verified.zip'
                  )
              finally:
                  session.close()
              with zipfile.ZipFile(archive_path) as archive:
                  extract_selected_verses(archive)
          # Trim only long leading/trailing silence; retain 100ms safety padding.
          for verse in (5, 6):
              source = work / ('verse_%02d.mp3' % verse)
              processed = work / ('processed_%02d.mp3' % verse)
              subprocess.run([
                  'ffmpeg','-hide_banner','-y','-i',str(source),
                  '-af','silenceremove=start_periods=1:start_duration=0.15:start_threshold=-50dB:start_silence=0.10:stop_periods=1:stop_duration=0.15:stop_threshold=-50dB:stop_silence=0.10',
                  '-c:a','libmp3lame','-q:a','2',str(processed)
              ],check=True)
          concat = work / 'concat.txt'
          concat.write_text("\n".join([
              "file '%s'" % (work / 'processed_05.mp3').resolve(),
              "file '%s'" % (work / 'processed_06.mp3').resolve(),
          ]) + "\n", encoding='utf-8')
          output = work / 'ash_sharh_94_5_6.mp3'
          subprocess.run(['ffmpeg','-hide_banner','-y','-f','concat','-safe','0','-i',str(concat),'-c:a','libmp3lame','-q:a','2',str(output)],check=True)
          manifest = json.loads(Path('content/first_video.json').read_text(encoding='utf-8'))
          manifest['audio']['production_audio_file'] = str(output)
          manifest['audio']['processed_verse_durations_seconds'] = durations
          manifest['audio']['inter_verse_silence_seconds'] = 0.02
          Path('build/first_video_manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          print('Pinned KFGQPC archive verified; exact Maher Al-Muaiqly Hafs verses 94:5-6 prepared.')
          PY
      - name: Render one or two review designs
        shell: bash
        env:
          COMPARE_DESIGNS: ${{ inputs.compare_designs }}
        run: |
          manifest='${{ steps.selection.outputs.manifest }}'
          if [ "$manifest" = 'content/second_video_ash_sharh_94_1_8_draft.json' ]; then manifest='build/manifest_for_render.json'; fi
          if [ "$manifest" = 'content/first_video.json' ]; then manifest='build/first_video_manifest.json'; fi
          if [ "$manifest" = 'content/candidate_surah_al_ikhlas_112_1_4.json' ]; then echo 'Audio-probe-only run; video render intentionally skipped until audio and visual approvals.'; exit 0; fi
          if [ "$COMPARE_DESIGNS" = "true" ]; then
            # First render downloads the approved background. The second reuses
            # that exact file so only the visual template changes.
            python src/render_video_scenes.py --manifest "$manifest" --template ornate_gold_classic --output output/review_classic.mp4
            python src/render_video_scenes.py --manifest "$manifest" --template minimal_mushaf --reuse-background --output output/review_minimal.mp4
          else
            python src/render_video_scenes.py --manifest "$manifest" --output output/review.mp4
          fi

      - name: Verify rendered MP4 technical quality
        if: steps.selection.outputs.manifest != 'content/candidate_surah_al_ikhlas_112_1_4.json'
        shell: bash
        env:
          COMPARE_DESIGNS: ${{ inputs.compare_designs }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          paths = (['output/review_classic.mp4', 'output/review_minimal.mp4']
                   if os.environ.get('COMPARE_DESIGNS') == 'true'
                   else ['output/review.mp4'])
          durations = []
          for path in paths:
              raw = subprocess.check_output([
                  'ffprobe', '-v', 'error', '-show_streams', '-show_format',
                  '-of', 'json', path
              ], text=True)
              info = json.loads(raw)
              video = next((s for s in info['streams'] if s.get('codec_type') == 'video'), None)
              audio = next((s for s in info['streams'] if s.get('codec_type') == 'audio'), None)
              duration = float(info['format']['duration'])
              if not video or not audio:
                  raise SystemExit(f'{path}: review MP4 must contain both video and audio streams.')
              if (video.get('width'), video.get('height')) != (1080, 1920):
                  raise SystemExit(f"{path}: expected 1080x1920, got {video.get('width')}x{video.get('height')}.")
              if video.get('r_frame_rate') != '30/1':
                  raise SystemExit(f"{path}: expected 30 fps, got {video.get('r_frame_rate')}.")
              if duration > 40 or duration < 1:
                  raise SystemExit(f'{path}: invalid review duration {duration:.2f}s (maximum 40s).')
              durations.append(duration)
              print(f'Validated {path}: 1080x1920, 30 fps, audio present, {duration:.2f}s')
          if len(durations) == 2 and abs(durations[0] - durations[1]) > 0.08:
              raise SystemExit(f'Comparison renders differ in duration: {durations}')
          PY

      - name: Send verified review MP4 directly to Telegram
        if: steps.selection.outputs.manifest != 'content/candidate_surah_al_ikhlas_112_1_4.json'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMPARE_DESIGNS: ${{ inputs.compare_designs }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TG_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Telegram secrets TG_BOT_TOKEN / TELEGRAM_CHAT_ID are not configured." >&2
            exit 1
          fi
          if [ "${COMPARE_DESIGNS}" = "true" ]; then
            for video in output/review_classic.mp4 output/review_minimal.mp4; do
              test -s "$video"
              caption="${video%.mp4}.caption.json"
              test -s "$caption"
              python src/send_telegram.py --video "$video" --caption "$caption"
            done
          else
            test -s output/review.mp4
            test -s output/review.caption.json
            python src/send_telegram.py --video output/review.mp4 --caption output/review.caption.json
          fi

      - name: Upload Al-Ikhlas source audio for private listening review
        if: steps.selection.outputs.manifest == 'content/candidate_surah_al_ikhlas_112_1_4.json'
        uses: actions/upload-artifact@v4
        with:
          name: al-ikhlas-audio-listening-review
          path: output/al_ikhlas_audio_review/*.mp3
          retention-days: 7

      - name: Upload review files (no publishing)
        if: steps.selection.outputs.manifest != 'content/candidate_surah_al_ikhlas_112_1_4.json'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: islamic-video-review
          path: |
            output/review.mp4
            output/review.caption.json
            output/review_classic.mp4
            output/review_classic.caption.json
            output/review_minimal.mp4
            output/review_minimal.caption.json
          if-no-files-found: ignore
          retention-days: 7
