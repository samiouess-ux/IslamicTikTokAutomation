name: Inspect official verse archive link

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-verse-archive-link.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-page:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Find official download links
        run: |
          python - <<'PY'
          import re
          import urllib.request
          from html import unescape

          url = "https://qurancomplex.gov.sa/quran-audio-hafs-muaiqly/"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=30) as response:
              html = response.read().decode("utf-8", "replace")
          print("Page bytes:", len(html))
          for match in re.finditer(r'''(?:href|data-url|data-href)\\s*=\\s*["']([^"']+)["']''', html, re.I):
              value = unescape(match.group(1))
              if any(term in value.lower() for term in (".zip", ".rar", ".7z", "download", "audio", "ayat", "verse")):
                  print(value)
          print("Relevant nearby markup:")
          for term in ("المصحف آيات", "تحميل آيات المصحف"):
              pos = html.find(term)
              if pos >= 0:
                  print(html[max(0, pos-1000):pos+1800])
          PY
