name: Diagnose approved Quran reference colors (review only)

on:
  push:
    branches: [feature/telegram-review-notifications]
    paths:
      - ".github/workflows/diagnose-quran-reference-colors.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect approved reference pixels
        run: |
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from PIL import Image, ImageDraw
          from collections import Counter
          from pathlib import Path
          import json

          source = Image.open("references/approved_quran_design.png").convert("RGB")
          w, h = source.size
          src = source.resize((1080, 1920), Image.Resampling.LANCZOS)
          regions = {
              "title_and_divider": (250, 400, 830, 750),
              "left_ornament": (138, 448, 270, 665),
              "right_ornament": (810, 448, 942, 665),
              "divider": (298, 650, 784, 730),
              "ayah_medallion": (103, 860, 207, 968),
              "upper_header": (100, 400, 980, 760),
          }
          report = {"image_size": [w, h], "regions": {}}
          target_regions = {
              "surah_title_glyphs": (270, 450, 810, 640),
              "ayah_number_glyph": (140, 885, 180, 950),
              "ayah_medallion_ring": (103, 860, 207, 968),
              "left_ornament": (138, 448, 270, 665),
              "divider": (298, 650, 784, 730),
          }
          from statistics import median
          for name, box in target_regions.items():
              pixels = list(src.crop(box).getdata())
              candidates = [p for p in pixels if p[0] > 180 and p[1] > 115
                            and p[2] < 150 and p[0] > p[1] * 1.02
                            and p[1] > p[2] * 1.08]
              report.setdefault("target_color_samples", {})[name] = {
                  "box": box,
                  "candidate_pixel_count": len(candidates),
                  "median_rgb": [round(median([p[i] for p in candidates])) for i in range(3)] if candidates else None,
                  "top_rgb": [[list(c), n] for c, n in Counter(candidates).most_common(30)],
              }
          sheet = Image.new("RGB", (w, h + 560), "#202020")
          sheet.paste(src, (0, 0))
          draw = ImageDraw.Draw(sheet)
          y = h
          for name, box in regions.items():
              crop = src.crop(box)
              pixels = list(crop.getdata())
              gold = [p for p in pixels if p[0] > p[1] > p[2] and p[0]-p[2] > 20]
              report["regions"][name] = {
                  "box": box,
                  "top_all_rgb": [[list(c), n] for c, n in Counter(pixels).most_common(15)],
                  "top_gold_rgb": [[list(c), n] for c, n in Counter(gold).most_common(25)],
              }
              preview = crop.resize((crop.width * 2, crop.height * 2))
              sheet.paste(preview, (10, y))
              draw.text((10, y-18), name, fill="white")
              y += preview.height + 24
          Path("reference-color-report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          sheet.save("reference-color-contact-sheet.jpg", quality=92)
          print(json.dumps({"image_size": [w, h], "regions": list(regions)}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: quran-reference-color-diagnostic
          path: |
            reference-color-report.json
            reference-color-contact-sheet.jpg
          if-no-files-found: error
          retention-days: 3
