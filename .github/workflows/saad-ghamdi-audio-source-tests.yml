name: Saad Al-Ghamdi isolated audio source tests

on:
  push:
    branches:
      - experiment/saad-ghamdi-audio-source
    paths:
      - "src/build_saad_ghamdi_audio_inventory.py"
      - "src/prepare_quran_review_batch_audio.py"
      - "tests/test_saad_ghamdi_audio_source.py"
      - "tests/test_prepare_quran_review_batch_audio.py"
      - ".github/workflows/saad-ghamdi-audio-source-tests.yml"

permissions:
  contents: read

jobs:
  isolated-source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out isolated experiment
        uses: actions/checkout@v4
        with:
          ref: experiment/saad-ghamdi-audio-source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check requests remotezip

      - name: Compile isolated source adapter
        run: |
          python -m py_compile src/build_saad_ghamdi_audio_inventory.py src/prepare_quran_review_batch_audio.py tests/test_saad_ghamdi_audio_source.py

      - name: Run Saad source mapping and direct-download tests
        run: python -m unittest discover -s tests -p 'test_saad_ghamdi_audio_source.py' -v

      - name: Probe two real EveryAyah audio files (first 4 KiB only)
        run: |
          python - <<'PY'
          import requests
          from urllib.parse import urlparse

          base = "https://everyayah.com/data/Ghamadi_40kbps/"
          samples = ("001001.mp3", "114006.mp3")
          for filename in samples:
              url = base + filename
              parsed = urlparse(url)
              if parsed.scheme != "https" or parsed.netloc != "everyayah.com":
                  raise SystemExit(f"Rejected unexpected host: {url}")
              with requests.get(url, stream=True, timeout=(20, 45), headers={"Range": "bytes=0-4095"}) as response:
                  response.raise_for_status()
                  first = next(response.iter_content(chunk_size=4096), b"")
                  if len(first) < 4:
                      raise SystemExit(f"Empty/short audio response: {filename}")
                  if not (first.startswith(b"ID3") or (first[0] == 0xFF and (first[1] & 0xE0) == 0xE0)):
                      raise SystemExit(f"Response does not look like MP3: {filename}; prefix={first[:8]!r}")
                  print(f"OK {filename}: HTTP {response.status_code}, inspected {len(first)} bytes")
          PY

      - name: Probe MP3Quran Saad audio and ayah timing availability
        run: |
          python - <<'PY'
          import requests

          session = requests.Session()
          audio_url = "https://cdn.mp3quran.net/download/audio/saad-ghamdi/r1/038.mp3"
          with session.get(audio_url, stream=True, timeout=(20, 45), headers={"Range": "bytes=0-4095"}) as response:
              response.raise_for_status()
              first = next(response.iter_content(chunk_size=4096), b"")
              if len(first) < 4 or not (first.startswith(b"ID3") or (first[0] == 0xFF and (first[1] & 0xE0) == 0xE0)):
                  raise SystemExit(f"MP3Quran audio sample is not a valid-looking MP3: HTTP {response.status_code}, prefix={first[:8]!r}")
              print(f"OK MP3Quran Saad surah 038: HTTP {response.status_code}, inspected {len(first)} bytes")

          reads_url = "https://mp3quran.net/api/v3/ayat_timing/reads"
          reads_response = session.get(reads_url, timeout=(20, 45))
          reads_response.raise_for_status()
          reads_payload = reads_response.json()
          if isinstance(reads_payload, dict):
              reads = reads_payload.get("reads", reads_payload.get("data", []))
          else:
              reads = reads_payload
          saad_reads = [row for row in reads if "سعد الغامدي" in str(row.get("name", "")) or "saad al-ghamdi" in str(row.get("name", "")).lower()]
          if not saad_reads:
              print("TIMING_NOT_LISTED: Saad Al-Ghamdi is not present in the v3 ayat_timing/reads catalogue")
          else:
              for read in saad_reads:
                  read_id = read.get("id")
                  print(f"TIMING_READ_FOUND: id={read_id}, name={read.get('name')}, riwaya={read.get('rewaya')}")
                  surah_response = session.get("https://mp3quran.net/api/v3/ayat_timing/soar", params={"read": read_id}, timeout=(20, 45))
                  surah_response.raise_for_status()
                  surahs = surah_response.json()
                  has_38 = any(int(row.get("id", 0)) == 38 for row in surahs)
                  print(f"SURAH_038_TIMING_AVAILABLE: {has_38}")
                  if has_38:
                      timing_response = session.get("https://mp3quran.net/api/v3/ayat_timing", params={"surah": 38, "read": read_id}, timeout=(20, 45))
                      timing_response.raise_for_status()
                      timings = timing_response.json()
                      ayahs = sorted((row for row in timings if int(row.get("ayah", -1)) > 0), key=lambda row: int(row["ayah"]))
                      print(f"SURAH_038_TIMING_ROWS: {len(ayahs)}")
                      expected = list(range(1, 89))
                      actual = [int(row["ayah"]) for row in ayahs]
                      if actual != expected:
                          raise SystemExit(f"Unexpected ayah coverage for Surah 038: {actual}")
                      previous_end = None
                      for row in ayahs:
                          start_ms = int(row["start_time"])
                          end_ms = int(row["end_time"])
                          if start_ms < 0 or end_ms <= start_ms:
                              raise SystemExit(f"Invalid timing row: {row}")
                          if previous_end is not None and start_ms < previous_end:
                              raise SystemExit(f"Overlapping/out-of-order timing row: {row}")
                          previous_end = end_ms
                      print(f"TIMING_SCHEMA_VALID: ayahs=1..88, first={ayahs[0]['start_time']}..{ayahs[0]['end_time']}ms, last={ayahs[-1]['start_time']}..{ayahs[-1]['end_time']}ms")
          PY

      - name: Download and decode one MP3Quran surah sample; compare duration with ayah timing
        run: |
          python - <<'PY'
          import json
          import subprocess
          import tempfile
          from pathlib import Path

          import requests

          session = requests.Session()
          audio_url = "https://cdn.mp3quran.net/download/audio/saad-ghamdi/r1/038.mp3"
          reads = session.get("https://mp3quran.net/api/v3/ayat_timing/reads", timeout=(20, 45))
          reads.raise_for_status()
          payload = reads.json()
          rows = payload.get("reads", payload.get("data", [])) if isinstance(payload, dict) else payload
          saad = next((row for row in rows if "سعد الغامدي" in str(row.get("name", ""))), None)
          if not saad:
              raise SystemExit("Saad Al-Ghamdi timing read not found")
          timing_response = session.get(
              "https://mp3quran.net/api/v3/ayat_timing",
              params={"surah": 38, "read": saad["id"]},
              timeout=(20, 45),
          )
          timing_response.raise_for_status()
          timings = timing_response.json()
          ayahs = [row for row in timings if int(row.get("ayah", -1)) > 0]
          if [int(row["ayah"]) for row in ayahs] != list(range(1, 89)):
              raise SystemExit("Surah 038 timing does not contain ayahs 1..88")
          final_timing_seconds = int(ayahs[-1]["end_time"]) / 1000

          with tempfile.TemporaryDirectory() as tmp:
              audio_path = Path(tmp) / "saad-surah-038.mp3"
              with session.get(audio_url, stream=True, timeout=(20, 90)) as response:
                  response.raise_for_status()
                  with audio_path.open("wb") as output:
                      for chunk in response.iter_content(chunk_size=1024 * 1024):
                          if chunk:
                              output.write(chunk)
              if audio_path.stat().st_size < 100_000:
                  raise SystemExit(f"Downloaded audio unexpectedly small: {audio_path.stat().st_size} bytes")

              probe = subprocess.run(
                  ["ffprobe", "-v", "error", "-show_entries", "format=duration",
                   "-of", "default=noprint_wrappers=1:nokey=1", str(audio_path)],
                  check=True, capture_output=True, text=True,
              )
              duration = float(probe.stdout.strip())
              decode = subprocess.run(
                  ["ffmpeg", "-v", "error", "-i", str(audio_path), "-f", "null", "-"],
                  capture_output=True, text=True,
              )
              if decode.returncode != 0:
                  raise SystemExit(f"Full MP3 decode failed: {decode.stderr[-2000:]}")
              delta = duration - final_timing_seconds
              print(f"FULL_MP3_BYTES: {audio_path.stat().st_size}")
              print(f"FFPROBE_DURATION_SECONDS: {duration:.3f}")
              print(f"LAST_AYAH_END_SECONDS: {final_timing_seconds:.3f}")
              print(f"AUDIO_TIMING_DURATION_DELTA_SECONDS: {delta:.3f}")
              if delta < -2.0 or delta > 10.0:
                  raise SystemExit("Audio duration is not plausibly aligned with the final ayah timing")
              print("FULL_MP3_DECODE_OK: True")
              print("AUDIO_DURATION_COMPATIBLE_WITH_TIMINGS: True")
          PY

      - name: Compare one EveryAyah per-ayah file with Saad timing interval
        run: |
          python - <<'PY'
          import subprocess
          import tempfile
          from pathlib import Path

          import requests

          session = requests.Session()
          reads = session.get("https://mp3quran.net/api/v3/ayat_timing/reads", timeout=(20, 45))
          reads.raise_for_status()
          payload = reads.json()
          rows = payload.get("reads", payload.get("data", [])) if isinstance(payload, dict) else payload
          saad = next((row for row in rows if "سعد الغامدي" in str(row.get("name", ""))), None)
          if not saad:
              raise SystemExit("Saad Al-Ghamdi timing read not found")
          timing_response = session.get(
              "https://mp3quran.net/api/v3/ayat_timing",
              params={"surah": 38, "read": saad["id"]},
              timeout=(20, 45),
          )
          timing_response.raise_for_status()
          ayah = next(row for row in timing_response.json() if int(row.get("ayah", -1)) == 1)
          timing_duration = (int(ayah["end_time"]) - int(ayah["start_time"])) / 1000

          url = "https://everyayah.com/data/Ghamadi_40kbps/038001.mp3"
          with tempfile.TemporaryDirectory() as tmp:
              audio = Path(tmp) / "038001.mp3"
              with session.get(url, stream=True, timeout=(20, 90)) as response:
                  response.raise_for_status()
                  with audio.open("wb") as output:
                      for chunk in response.iter_content(chunk_size=256 * 1024):
                          if chunk:
                              output.write(chunk)
              if audio.stat().st_size < 1000:
                  raise SystemExit("EveryAyah sample unexpectedly small")
              probe = subprocess.run(
                  ["ffprobe", "-v", "error", "-show_entries", "format=duration",
                   "-of", "default=noprint_wrappers=1:nokey=1", str(audio)],
                  check=True, capture_output=True, text=True,
              )
              duration = float(probe.stdout.strip())
              decode = subprocess.run(
                  ["ffmpeg", "-v", "error", "-i", str(audio), "-f", "null", "-"],
                  capture_output=True, text=True,
              )
              if decode.returncode:
                  raise SystemExit(f"EveryAyah MP3 decode failed: {decode.stderr[-1000:]}")
              print(f"EVERYAYAH_038001_BYTES: {audio.stat().st_size}")
              print(f"EVERYAYAH_038001_DURATION_SECONDS: {duration:.3f}")
              print(f"MP3QURAN_038001_TIMING_INTERVAL_SECONDS: {timing_duration:.3f}")
              print(f"PER_AYAH_DURATION_DIFFERENCE_SECONDS: {duration-timing_duration:.3f}")
              print("EVERYAYAH_SINGLE_AYAH_DECODE_OK: True")
          PY

      - name: Run existing audio preparation regression tests
        run: python -m unittest discover -s tests -p 'test_prepare_quran_review_batch_audio.py' -v
