name: Fetch Mixkit vertical nature background

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fetch-pexels-background.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-background:
    if: github.ref != 'refs/heads/feature/quran-video-pro'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve and download the Mixkit vertical waterfall clip
        run: |
          python - <<'PY'
          import re, requests
          from pathlib import Path
          from html import unescape

          page_url = "https://mixkit.co/free-stock-video/waterfall-between-green-hills-100174/"
          response = requests.get(page_url, headers={"User-Agent": "Mozilla/5.0"}, timeout=60)
          print("Mixkit page status:", response.status_code)
          response.raise_for_status()
          html = unescape(response.text).replace("\\/", "/")
          matches = re.findall(r'"contentUrl"\s*:\s*"([^"]+\.mp4[^"]*)"', html)
          urls = list(dict.fromkeys(matches))
          if not urls:
              raise RuntimeError("Mixkit page did not expose a contentUrl MP4 field.")
          print("Video URLs found:", len(urls))
          for url in urls:
              print("Candidate:", url)
          selected = next((u for u in urls if "720" in u), urls[0])
          print("Selected:", selected)
          r = requests.get(selected, headers={"User-Agent": "Mozilla/5.0"}, stream=True, timeout=120)
          r.raise_for_status()
          print("Content type:", r.headers.get("content-type"))
          target = Path("mixkit_waterfall_green_hills_100174.mp4")
          total = 0
          with target.open("wb") as out:
              for chunk in r.iter_content(1024*1024):
                  if chunk:
                      out.write(chunk)
                      total += len(chunk)
          if total < 100_000:
              raise RuntimeError(f"Downloaded file unexpectedly small: {total} bytes")
          print(f"Downloaded {target}: {total} bytes")
          PY

      - name: Verify video and create preview
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height,r_frame_rate -of json mixkit_waterfall_green_hills_100174.mp4 | tee mixkit_metadata.json
          ffmpeg -hide_banner -y -ss 3 -i mixkit_waterfall_green_hills_100174.mp4 -frames:v 1 mixkit_preview.jpg
          sha256sum mixkit_waterfall_green_hills_100174.mp4

      - name: Upload candidate and preview for review
        uses: actions/upload-artifact@v4
        with:
          name: mixkit-waterfall-background-review
          path: |
            mixkit_waterfall_green_hills_100174.mp4
            mixkit_metadata.json
            mixkit_preview.jpg
          if-no-files-found: error
          retention-days: 7
