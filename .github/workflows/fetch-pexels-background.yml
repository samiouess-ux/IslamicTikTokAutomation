name: Fetch Mixkit vertical nature background

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fetch-pexels-background.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-background:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve and download the Mixkit vertical waterfall clip
        run: |
          python - <<'PY'
          import re, requests
          from pathlib import Path
          from html import unescape

          page_url = "https://mixkit.co/free-stock-video/waterfall-between-green-hills-100174/"
          headers = {"User-Agent": "Mozilla/5.0"}
          response = requests.get(page_url, headers=headers, timeout=60)
          print("Mixkit page status:", response.status_code)
          response.raise_for_status()
          html = unescape(response.text).replace("\\/", "/").replace("&amp;", "&")
          candidates = list(dict.fromkeys(re.findall(r'https?://[^"\\s<>]+?\\.mp4(?:\\?[^"\\s<>]*)?', html)))
          candidates = [u.rstrip("\\'\\),;") for u in candidates]
          if not candidates:
              for token in ("mixkit", ".mp4", "video"):
                  pos = html.find(token)
                  if pos >= 0:
                      print(f"Page excerpt near {token}:", html[max(0,pos-250):pos+900])
              raise RuntimeError("No direct MP4 URL found in Mixkit page HTML; stopping rather than guessing a download URL.")
          print("Found MP4 candidates:", len(candidates))
          for i, url in enumerate(candidates[:10]):
              print(f"Candidate {i}: {url[:260]}")
          # Prefer an explicit 1080p asset when the page exposes one.
          selected = next((u for u in candidates if "1080" in u), candidates[0])
          print("Selected MP4:", selected)
          r = requests.get(selected, headers=headers, stream=True, timeout=120)
          r.raise_for_status()
          print("Video content type:", r.headers.get("content-type"))
          target = Path("mixkit_waterfall_green_hills_100174.mp4")
          total = 0
          with target.open("wb") as out:
              for chunk in r.iter_content(1024*1024):
                  if chunk:
                      out.write(chunk)
                      total += len(chunk)
          if total < 100_000:
              raise RuntimeError(f"Downloaded file unexpectedly small: {total} bytes")
          print(f"Downloaded {target}: {total} bytes")
          PY

      - name: Verify vertical format and create preview
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height,r_frame_rate -of json mixkit_waterfall_green_hills_100174.mp4 | tee mixkit_metadata.json
          ffmpeg -hide_banner -y -ss 3 -i mixkit_waterfall_green_hills_100174.mp4 -frames:v 1 mixkit_preview.jpg
          sha256sum mixkit_waterfall_green_hills_100174.mp4

      - name: Upload candidate and preview for review
        uses: actions/upload-artifact@v4
        with:
          name: mixkit-waterfall-background-review
          path: |
            mixkit_waterfall_green_hills_100174.mp4
            mixkit_metadata.json
            mixkit_preview.jpg
          if-no-files-found: error
          retention-days: 7
