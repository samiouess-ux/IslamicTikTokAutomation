name: Fetch Pexels background candidate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fetch-pexels-background.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-background:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve the downloadable MP4 from the public Pexels page
        run: |
          python - <<'PY'
          import json, re, requests
          from pathlib import Path
          from html import unescape

          page_url = "https://www.pexels.com/video/serene-blue-ocean-horizon-with-distant-mountains-37336447/"
          response = requests.get(page_url, headers={"User-Agent": "Mozilla/5.0"}, timeout=60)
          print("Page status:", response.status_code)
          response.raise_for_status()
          html = unescape(response.text)

          # Pexels embeds video file metadata in the public page's JSON.
          links = list(dict.fromkeys(re.findall(r'https?[^"\\\\ ]+?\\.mp4(?:\\?[^"\\\\ ]*)?', html)))
          links = [x.replace("\\u0026", "&").replace("\\/", "/").replace("&amp;", "&") for x in links]
          if not links:
              # Keep a small diagnostic excerpt rather than silently trying an invented URL.
              for token in ("video_files", "videos.pexels.com", "player.vimeo.com"):
                  pos = html.find(token)
                  if pos >= 0:
                      print(f"Found {token}; nearby page data:", html[max(0,pos-300):pos+1200])
              raise RuntimeError("No direct MP4 link was exposed in the public Pexels page. API-key authentication may be required.")
          print("Discovered MP4 candidates:", len(links))
          for i, link in enumerate(links[:10]):
              print(f"Candidate {i}: {link[:240]}")

          # Prefer the largest vertical MP4 when dimensions are embedded in page metadata;
          # otherwise try the first discovered MP4 and verify dimensions afterwards.
          selected = links[0]
          for link in links:
              if "2160" in link or "1080" in link:
                  selected = link
                  break
          print("Selected direct MP4 URL:", selected)
          r = requests.get(selected, headers={"User-Agent":"Mozilla/5.0"}, stream=True, timeout=120)
          r.raise_for_status()
          print("MP4 Content-Type:", r.headers.get("content-type"))
          target = Path("pexels_ocean_mountains_37336447.mp4")
          total = 0
          with target.open("wb") as out:
              for chunk in r.iter_content(1024*1024):
                  if chunk:
                      out.write(chunk)
                      total += len(chunk)
          if total < 100_000:
              raise RuntimeError(f"Downloaded file too small: {total} bytes")
          print(f"Downloaded {target}: {total} bytes")
          PY

      - name: Verify video metadata and create a preview
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height,r_frame_rate -of json pexels_ocean_mountains_37336447.mp4 | tee pexels_metadata.json
          ffmpeg -hide_banner -y -ss 3 -i pexels_ocean_mountains_37336447.mp4 -frames:v 1 pexels_preview.jpg
          sha256sum pexels_ocean_mountains_37336447.mp4

      - name: Upload background and preview for review
        uses: actions/upload-artifact@v4
        with:
          name: pexels-ocean-mountains-background-review
          path: |
            pexels_ocean_mountains_37336447.mp4
            pexels_metadata.json
            pexels_preview.jpg
          if-no-files-found: error
          retention-days: 7
